name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'site/**'
      - 'scripts/sync-content.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # python3 is preinstalled on ubuntu-latest runners; sync-content.py only
      # uses stdlib so no setup-python action is needed.

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate static site
        # `bun run generate` runs sync-content.py (markdown from plugins/*/SKILL.md
        # → site/content/plugins/) then `nuxt generate`. Output lands in
        # site/.output/public. baseURL defaults to /claude-plugins/ per
        # nuxt.config.ts so asset paths resolve correctly under the GH Pages
        # repo subpath. Override with NUXT_APP_BASE_URL for custom domain.
        run: bun run generate

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
