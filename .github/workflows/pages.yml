name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'site/**'
      - 'scripts/sync-content.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  # wrangler-action posts a deploy comment on the commit when granted.
  deployments: write

concurrency:
  # Serialize CF Pages production deploys so a fast second push doesn't race
  # with the first deployment's still-uploading-assets step.
  group: cf-pages-claude-plugins
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate static site
        # `bun run generate` chains sync-content.py (markdown from
        # plugins/*/SKILL.md → site/content/plugins/) then `nuxt generate`.
        # Output lands in site/.output/public. baseURL defaults to '/' so
        # asset paths resolve correctly under the claude-plugins.aiocean.dev
        # custom domain. python3 is preinstalled on ubuntu-latest.
        run: bun run generate

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action ignores the job-level working-directory default,
          # so workingDirectory must be explicit here.
          workingDirectory: site
          command: pages deploy .output/public --project-name=claude-plugins --branch=main --commit-dirty=true
