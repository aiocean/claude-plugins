<!doctype html>
<html lang="en" data-theme="signal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duoc // claude playbook · aiocean/claude-plugins</title>
<meta name="description" content="how I work with Claude Code — full MS-DOS terminal playbook powered by ghostty-web. type 'help' to start">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   MS-DOS TERMINAL MODE · CP437 · VGA 16-color · CRT scanlines
   signal = green-on-black (default DOS)
   void   = amber-on-black (monochrome CRT alt)
   ════════════════════════════════════════════════════════════════ */
:root, [data-theme="signal"] {
  --bg:           #000000;
  --ink:          #c0c0c0;
  --lime:         #55ff55;
  --grid-tint:    rgba(85,255,85,0.05);
  --scan-opacity: 0.12;
  --f-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Menlo', 'Monaco', 'Courier New', monospace;
}

[data-theme="void"] {
  --bg:           #0c0600;
  --ink:          #ffb86b;
  --lime:         #ffaa00;
  --grid-tint:    rgba(255,184,107,0.03);
  --scan-opacity: 0.22;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-mono);
  font-size: 14px;
  line-height: 1.4;
  height: 100vh;
  overflow: hidden;
}
::selection { background: var(--lime); color: #000; }

/* subtle grid tint */
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    repeating-linear-gradient(0deg,  transparent 0 19px, var(--grid-tint) 19px 20px),
    repeating-linear-gradient(90deg, transparent 0 19px, var(--grid-tint) 19px 20px);
  pointer-events: none;
  z-index: 0;
}

/* CRT scanlines — aggressive on top of terminal for the TUI feel */
body::after {
  content: "";
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,var(--scan-opacity)) 0,
    rgba(0,0,0,var(--scan-opacity)) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
  z-index: 5;
  mix-blend-mode: multiply;
}

/* ════ GHOSTTY-WEB TERMINAL — fills the viewport ════ */
/* right: -16px pushes the canvas 16px past the viewport so ghostty-web's
   hardcoded 14px-wide scrollbar gutter (rendered at canvasWidth-14 in
   renderScrollbar(), no public config to disable) is clipped off-screen.
   body overflow:hidden prevents this from triggering horizontal scroll.
   FitAddon refits to the wider container so cell content fills the visible
   viewport edge-to-edge. */
#ghostty-terminal {
  position: fixed;
  top: 0; left: 0; right: -16px; bottom: 0;
  z-index: 1;
  background: #000;
  overflow: hidden;
  padding: 8px 0 4px 8px;
}
#ghostty-terminal canvas { display: block; }

/* ════ SIGNAL: neon glow on terminal text + soft vignette ════ */
[data-theme="signal"] body {
  background:
    radial-gradient(ellipse 95% 75% at center, rgba(12, 36, 22, 0.55) 0%, transparent 70%),
    #000000;
}
[data-theme="signal"] #ghostty-terminal canvas {
  filter:
    drop-shadow(0 0 1px rgba(85, 255, 85, 0.55))
    drop-shadow(0 0 4px rgba(85, 255, 85, 0.22));
}
/* small screens */
@media (max-width: 640px) {
  #ghostty-terminal { padding: 4px 0 4px 2px; } /* right=0 keeps scrollbar flush */
}

/* ════ CUSTOM DOS BLOCK CURSOR — hides native mouse, follows movement ════ */
html, body, #ghostty-terminal, #ghostty-terminal * {
  cursor: none !important;
}
#dos-cursor {
  position: fixed;
  top: 0; left: 0;
  width: 10px;
  height: 18px;
  background: var(--lime);
  box-shadow: 0 0 6px var(--lime);
  pointer-events: none;
  z-index: 100;
  opacity: 0;
  transform: translate3d(-50px, -50px, 0);
  will-change: transform;
}
#dos-cursor.active {
  animation: dos-cursor-blink 1.06s steps(2, start) infinite;
}
/* over-link: DOS cursor turns magenta + halo when hovering a clickable
   region. Visual signal click affordance, since `cursor: none !important`
   above blocks the native pointer change ghostty-web emits. */
#dos-cursor.over-link {
  background: var(--magenta, #ff79c6);
  box-shadow: 0 0 10px var(--magenta, #ff79c6), 0 0 18px var(--magenta, #ff79c6);
  animation-duration: 0.5s; /* faster blink = active hint */
}
@keyframes dos-cursor-blink {
  0%, 49%   { opacity: 1; }
  50%, 100% { opacity: 0; }
}
</style>
</head>
<body>

<!-- ══ FULL-VIEWPORT GHOSTTY-WEB TERMINAL (hosts BIOS POST + TUI) ══ -->
<div id="ghostty-terminal" role="application" aria-label="claude-plugins TUI"></div>

<!-- ══ CUSTOM DOS BLOCK CURSOR (mouse-follower, replaces native pointer) ══ -->

<script type="module">
import { init, Terminal, FitAddon } from 'https://esm.sh/ghostty-web@0.4.0';

/* ══════════════════════════════════════════════════════════════
   THEMES (DOS VGA 16-color palette for signal, amber monochrome for void)
   ══════════════════════════════════════════════════════════════ */
const SIGNAL_THEME = {
  background: '#000000', foreground: '#c0c0c0',
  cursor: '#55ff55', cursorAccent: '#000000',
  selectionBackground: '#55ff5544',
  black: '#000000', red: '#aa0000', green: '#00aa00', yellow: '#aa5500',
  blue: '#0000aa', magenta: '#aa00aa', cyan: '#00aaaa', white: '#c0c0c0',
  brightBlack: '#555555', brightRed: '#ff5555', brightGreen: '#55ff55',
  brightYellow: '#ffff55', brightBlue: '#5555ff', brightMagenta: '#ff55ff',
  brightCyan: '#55ffff', brightWhite: '#ffffff',
};
const VOID_THEME = {
  background: '#000000', foreground: '#ffb86b',
  cursor: '#ffd866', cursorAccent: '#000000',
  selectionBackground: '#ffb86b44',
  black: '#000000', red: '#cc4422', green: '#aa5500', yellow: '#aa6600',
  blue: '#884400', magenta: '#cc6622', cyan: '#bb8844', white: '#ffb86b',
  brightBlack: '#6b4420', brightRed: '#ff5555', brightGreen: '#ffaa00',
  brightYellow: '#ffd866', brightBlue: '#ffaa00', brightMagenta: '#ff8844',
  brightCyan: '#ffcc88', brightWhite: '#ffffff',
};
const currentTheme = () => document.documentElement.getAttribute('data-theme') === 'void' ? VOID_THEME : SIGNAL_THEME;

/* ══════════════════════════════════════════════════════════════
   ANSI helpers
   ══════════════════════════════════════════════════════════════ */
const CSI = '\x1b[';
// Scroll-preserving clear. ESC[2J erases visible cells in place without
// pushing them into scrollback (per VT spec, honored by ghostty-web's
// parser) — so first-boot BIOS POST vanishes when autoPlay clears and
// the user can't scroll up to read it. Instead: move cursor to last row,
// emit \n × rows to scroll the viewport into scrollback, then home.
// Falls back to 24 rows if term isn't ready yet.
function clearScreen() {
  const rows = (term && term.rows) || 24;
  return CSI + rows + ';1H' + '\n'.repeat(rows) + CSI + 'H';
}
const RESET = CSI + '0m', BOLD = CSI + '1m', UNDERLINE = CSI + '4m';
const FG = (n) => CSI + n + 'm';
const C = {
  cyan: FG(36), grey: FG(90),
  bred: FG(91), bgreen: FG(92), byellow: FG(93),
  bmagenta: FG(95), bcyan: FG(96), bwhite: FG(97),
};

/* ══════════════════════════════════════════════════════════════
   GLOBAL STATE
   ══════════════════════════════════════════════════════════════ */
let term;
let pluginsData = [];
let inputBuffer = '';
let history = [];
let historyIndex = -1; // -1 = current line, >=0 = viewing history
let savedBuffer = ''; // saved current line when scrolling into history
let isRunning = true; // false after quit
let autoPlayPhase = false;
let skipAutoPlay = false;
let animatedOutput = false;
const LINE_DELAY = 18;
const PROMPT = C.bgreen + 'C:' + C.bmagenta + '\\CLAUDE' + RESET + '> ';

function pause(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ══════════════════════════════════════════════════════════════
   INSTALL MODAL — alt-screen overlay, click or command driven
   trigger sources:
     - click on "[ install <name> ]" link inside a plugin card
     - typed command `install <name>` from prompt
   keys while open: c=copy, esc/enter/q/^C=close
   ══════════════════════════════════════════════════════════════ */
// Plugin name charset — defense-in-depth filter at JS boundary. Mirrors the
// regex enforced by scripts/validate-marketplace.sh. A name slipping past CI
// (or a corrupt data.json) gets dropped here before reaching term.write or
// clipboard, blocking ANSI-injection / shell-injection vectors.
const SAFE_PLUGIN_NAME = /^[a-z0-9][a-z0-9-]{0,63}$/;

// Single source of truth for the clickable button text. Both renderPluginCard
// and the LinkProvider consume this — keeps the regex and the rendered string
// in lockstep, so a future rename can't desync the two halves.
function installLabel(name) { return '[ install ' + name + ' ]'; }
function installLabelPattern() { return /\[ install ([a-z0-9][a-z0-9-]{0,63}) \]/g; }

let modalPhase = false;
let modalPlugin = null;
let modalNeedsPrompt = false;        // true when opened via typed command — close emits a fresh prompt
let modalCopyState = 'idle';         // 'idle' | 'copied' | 'failed' — preserved across resize redraws
let modalSavedViewportY = 0;         // restore scrollback position after close
let installLinkHovers = 0;           // counter — DOS cursor highlights when > 0
let installLinkDisposable = null;    // captured from registerLinkProvider for future teardown
const dosCursorEl = () => document.getElementById('dos-cursor');

function openInstallModal(pluginName, viaCommand) {
  // Guards: no re-entry, no double-open during BIOS/autoPlay (alt-screen would
  // collide with running writes and the input handler can't reach the modal
  // close path while autoPlayPhase is true).
  if (modalPhase) return false;
  if (biosPhase) return false;
  if (autoPlayPhase) { skipAutoPlay = true; return false; }
  const p = pluginsData.find(x => x.name === pluginName);
  if (!p) return false;
  modalPlugin = p;
  modalCopyState = 'idle';
  modalNeedsPrompt = !!viaCommand;
  // Snapshot scrollback position so close can restore the user's view if they
  // had scrolled up to read an earlier card before clicking.
  modalSavedViewportY = (term && term.buffer && term.buffer.active) ? term.buffer.active.viewportY : 0;
  modalPhase = true;
  // 1049: save cursor + enter alt screen + clear. 25l: hide cursor while modal up.
  term.write(CSI + '?1049h' + CSI + '?25l');
  try {
    drawInstallModal();
  } catch (e) {
    // Bail out cleanly if drawing throws — never strand the user in alt screen.
    closeInstallModal();
    throw e;
  }
  return true;
}

function closeInstallModal() {
  if (!modalPhase) return;
  modalPhase = false;
  modalPlugin = null;
  modalCopyState = 'idle';
  // 1049 reset: leave alt screen + restore cursor. 25h: show cursor again.
  term.write(CSI + '?1049l' + CSI + '?25h');
  // Restore scrollback view (1049 restores cursor but not viewport).
  if (term && typeof term.scrollToLine === 'function') {
    try { term.scrollToLine(modalSavedViewportY); } catch (e) {}
  }
  if (modalNeedsPrompt) printPrompt();
  modalNeedsPrompt = false;
}

// Soft-wrap a long string into multiple lines no wider than `width`.
// Breaks on spaces when possible, falls back to hard slice when a single
// token exceeds `width` (install commands are tokenless paths so always slice).
function wrapForModal(text, width) {
  if (!text) return [''];
  if (text.length <= width) return [text];
  const out = [];
  let s = text;
  while (s.length > width) {
    let cut = s.lastIndexOf(' ', width);
    if (cut <= 0) cut = width;       // no space → hard cut
    out.push(s.slice(0, cut));
    s = s.slice(cut === width ? cut : cut + 1);
  }
  if (s) out.push(s);
  return out;
}

function drawInstallModal() {
  const p = modalPlugin;
  if (!p) return;
  const cols = (term && term.cols) || 80;
  const rows = (term && term.rows) || 24;
  // Clamp width: 20 is the minimum that still renders borders + 2-char inner padding.
  // Below cols=28 the modal becomes useless but at least won't crash or truncate
  // commands silently — we wrap them onto multiple lines instead.
  const w = Math.max(20, Math.min(cols - 8, 72));
  const inner = w - 4; // 4 = 2 border cols + 2 padding cols (one each side)

  const title = ' INSTALL · ' + p.name + ' ';
  const cmd1 = '/plugin marketplace add aiocean/claude-plugins';
  const cmd2 = '/plugin install ' + p.name + '@aiocean-plugins';
  let help;
  if (modalCopyState === 'copied')      help = '✓ copied to clipboard · [esc/enter] close';
  else if (modalCopyState === 'failed') help = '⚠ clipboard denied · select text manually';
  else                                  help = '[c] copy   [esc/enter/q] close';

  // Wrap commands onto multiple lines if they exceed available width — never
  // silently truncate the one piece of text users came here to copy.
  const cmd1Lines = wrapForModal(cmd1, inner - 1).map(l => ' ' + l);
  const cmd2Lines = wrapForModal(cmd2, inner - 1).map(l => ' ' + l);
  const helpLines = wrapForModal(help, inner - 1).map(l => ' ' + l);

  const body = [
    '',
    ' STEP 1 · register marketplace',
    ...cmd1Lines,
    '',
    ' STEP 2 · install plugin',
    ...cmd2Lines,
    '',
    ...helpLines,
    '',
  ];

  const h = body.length + 2; // +2 for top/bottom border
  const top = Math.max(1, Math.floor((rows - h) / 2));
  const left = Math.max(1, Math.floor((cols - w) / 2));
  const move = (r, c) => CSI + r + ';' + c + 'H';

  term.write(CSI + '2J');

  // Top border with embedded title — clip title if narrower than its display length
  const titleVis = Math.min(title.length, Math.max(4, w - 6));
  const titleClipped = title.slice(0, titleVis);
  const remaining = w - 2 - titleVis;
  const leftBar = '═'.repeat(Math.max(2, Math.floor(remaining / 2)));
  const rightBar = '═'.repeat(Math.max(2, w - 2 - titleVis - leftBar.length));
  term.write(move(top, left) + C.bmagenta + '╔' + leftBar +
    BOLD + C.bcyan + titleClipped + RESET + C.bmagenta + rightBar + '╗' + RESET);

  // Body — color decided by line prefix / state
  for (let i = 0; i < body.length; i++) {
    const raw = (body[i] || '').slice(0, inner);
    const padLen = Math.max(0, inner - raw.length);
    let col = C.bwhite;
    if (raw.startsWith(' STEP'))               col = BOLD + C.byellow;
    else if (raw.startsWith(' /plugin'))       col = C.bgreen;
    else if (raw.indexOf('✓ copied') >= 0)     col = BOLD + C.bgreen;
    else if (raw.indexOf('⚠') >= 0)            col = BOLD + C.byellow;
    else if (raw.indexOf('[') >= 0)            col = C.grey;
    term.write(move(top + 1 + i, left) +
      C.bmagenta + '║ ' + RESET +
      col + raw + RESET + ' '.repeat(padLen) +
      C.bmagenta + ' ║' + RESET);
  }

  // Bottom border
  term.write(move(top + h - 1, left) +
    C.bmagenta + '╚' + '═'.repeat(w - 2) + '╝' + RESET);
}

async function copyInstallCmds() {
  const p = modalPlugin;
  if (!p) return;
  const cmds = '/plugin marketplace add aiocean/claude-plugins\n/plugin install ' + p.name + '@aiocean-plugins';
  let ok = false;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { await navigator.clipboard.writeText(cmds); ok = true; } catch (e) {}
  }
  modalCopyState = ok ? 'copied' : 'failed';
  drawInstallModal();
}

/* writes each line; pauses between them only when animatedOutput is on.
   Commands run with animatedOutput=false → loop stays fully sync (no microtask yield),
   so subsequent prompt printing sees the correct write order. */
async function writeLines(lines) {
  for (const l of lines) {
    term.write(l);
    if (animatedOutput && !skipAutoPlay) await pause(LINE_DELAY);
  }
}

/* BIOS POST state (phase before welcome, once per session) */
let biosPhase = false;
let biosResolve = null;
let biosTypingDone = false;
let biosLineIndex = 0;

const BIOS_LINES = [
  'AMI BIOS (C) 1992 American Megatrends, Inc.',
  'CPU: Intel(R) 80486DX2 @ 66MHz',
  'Memory Test: ' + C.bgreen + '640K OK' + RESET,
  'Extended Memory: ' + C.bgreen + '32768K OK' + RESET,
  'HDD0: ' + C.bgreen + 'CLAUDE-PLUGINS' + RESET + ' [2 GB]',
  'CDROM0: DOSLAND',
  '',
  'Press ' + BOLD + C.bmagenta + 'DEL' + RESET + ' to enter SETUP',
  '',
  'Starting MS-DOS...',
  '',
  'HIMEM is testing extended memory..........' + C.bgreen + 'done.' + RESET,
  'EMM386 successfully installed.',
  '',
  'C:\\AUTOEXEC.BAT',
  '@ECHO OFF',
  'PATH C:\\DOS;C:\\AIOCEAN;C:\\CLAUDE',
  'SET PROMPT=$P$G',
  'LH C:\\DOS\\MOUSE.COM',
  'LH C:\\DOS\\DOSKEY',
  '',
  ' [INIT] mounting marketplace ........ ' + C.bgreen + 'OK' + RESET,
  ' [INIT] 40+ plugins registered ...... ' + C.bgreen + 'OK' + RESET,
  ' [INIT] RTK hook active ............. ' + C.bgreen + 'OK' + RESET,
  ' [INIT] ghostty-web WASM booted ..... ' + C.bgreen + 'OK' + RESET,
  ' [WARN] user\'s attention span ....... ' + BOLD + C.bmagenta + 'LOW' + RESET,
  ' [WARN] backlog of unread blogs ..... ' + BOLD + C.byellow + 'CRITICAL' + RESET,
  '',
  'C:\\> ' + C.bgreen + 'CLAUDE.EXE --playbook /ROOT' + RESET,
  '',
  C.byellow + '>' + RESET + ' Press ' + BOLD + C.bmagenta + 'ENTER' + RESET + ' to continue',
];

function renderBIOS() {
  return new Promise((resolve) => {
    biosPhase = true;
    biosResolve = resolve;
    biosTypingDone = false;
    biosLineIndex = 0;
    // Terminal is fresh at boot — just home the cursor. Calling clearScreen()
    // here would pollute scrollback with `term.rows` empty lines users would
    // hit when scrolling up.
    term.write(CSI + 'H');
    typeBiosLine();
  });
}

function typeBiosLine() {
  if (!biosPhase) return;
  if (biosLineIndex >= BIOS_LINES.length) {
    biosTypingDone = true;
    return;
  }
  term.write(BIOS_LINES[biosLineIndex] + '\r\n');
  const plain = BIOS_LINES[biosLineIndex].replace(/\x1b\[[0-9;]*m/g, '');
  biosLineIndex++;
  const d = !plain.trim() ? 110 : (25 + Math.random() * 55);
  setTimeout(typeBiosLine, d);
}

function biosEnterPressed() {
  if (!biosTypingDone) {
    while (biosLineIndex < BIOS_LINES.length) {
      term.write(BIOS_LINES[biosLineIndex] + '\r\n');
      biosLineIndex++;
    }
    biosTypingDone = true;
  } else {
    biosPhase = false;
    const r = biosResolve;
    biosResolve = null;
    r && r();
  }
}

function printPrompt() {
  term.write('\r\n' + PROMPT);
  inputBuffer = '';
  historyIndex = -1;
}

/* ══════════════════════════════════════════════════════════════
   SECTION DATA (single source of truth for autoPlay + commands)
   ══════════════════════════════════════════════════════════════ */
const COLOR_MAP = { lime: C.bgreen, magenta: C.bmagenta, cyan: C.bcyan, amber: C.byellow };
const colorFor = (k) => COLOR_MAP[k] || C.bmagenta;

const PRINCIPLES = [
  { num: 'R1', title: 'iteration-first', color: 'lime',

const MANIFESTO_INTRO_LINES = [
  '',
  'REM first-person · why i wrote this file',
  '',
  'CLAUDE.md của tôi không phải là config file. nó là kỷ luật tôi học bằng cách fail —',

const MANIFESTO_QUOTES = [
  { badge: 'anti-sycophancy', color: 'lime',
    quote: 'Agreement for the sake of agreement = disrespect.',

const MANIFESTO_STRUCTURE_LINES = [
  '',

   SECTION RENDERERS

async function renderSectionHeader(idx, title, meta) {
  const cols = (term && term.cols) || 80;
  const w = Math.min(cols - 4, 84);
  const left = '══ ' + idx + ' ' + title.toUpperCase() + ' ';
  const metaChunk = meta ? (C.grey + meta + RESET + ' ' + C.bmagenta + '══') : '══';
  const metaLen = meta ? meta.length + 4 : 2;
  const fill = Math.max(2, w - left.length - metaLen);
  await writeLines([
    '\r\n',
    '  ' + C.bmagenta + BOLD + left + '═'.repeat(fill) + ' ' + metaChunk + RESET + '\r\n\r\n',
  ]);
}

async function renderPrincipleCard(rule) {
  const cols = (term && term.cols) || 80;
  const w = Math.min(cols - 4, 84);
  const inner = w - 4;
  const pad = '  ';
  const hLine = '═'.repeat(w - 2);
  const sLine = '─'.repeat(w - 2);
  const col = colorFor(rule.color);
  const numTxt = 'Rule ' + rule.num;
  const titleGap = Math.max(1, inner - rule.title.length - numTxt.length);
  const bodyLines = wrapText(rule.body, inner, '').split('\r\n').slice(0, 4);
  const quoteLines = wrapText('"' + rule.quote + '"', inner, '').split('\r\n').slice(0, 2);

  await writeLines([
    pad + col + '╔' + hLine + '╗' + RESET + '\r\n',
    pad + col + '║ ' + RESET + BOLD + col + rule.title + RESET + ' '.repeat(titleGap) + C.byellow + numTxt + RESET + col + ' ║' + RESET + '\r\n',
    pad + col + '╟' + sLine + '╢' + RESET + '\r\n',
    ...bodyLines.map(line => pad + col + '║ ' + RESET + C.grey + line.padEnd(inner) + RESET + col + ' ║' + RESET + '\r\n'),
    ...quoteLines.map(line => pad + col + '║ ' + RESET + BOLD + col + line.padEnd(inner) + RESET + col + ' ║' + RESET + '\r\n'),
    pad + col + '╚' + hLine + '╝' + RESET + '\r\n',
  ]);
}

async function renderQuoteCard(q) {
  const cols = (term && term.cols) || 80;
  const w = Math.min(cols - 4, 84);
  const inner = w - 4;
  const pad = '  ';
  const hLine = '═'.repeat(w - 2);
  const sLine = '─'.repeat(w - 2);
  const col = colorFor(q.color);
  const badgeTxt = '[ ' + q.badge + ' ]';
  const badgeGap = Math.max(1, inner - badgeTxt.length);
  const quoteLines = wrapText('"' + q.quote + '"', inner, '').split('\r\n').slice(0, 2);
  const narrLines = wrapText(q.narrator, inner, '').split('\r\n').slice(0, 3);

  await writeLines([
    pad + col + '╔' + hLine + '╗' + RESET + '\r\n',
    pad + col + '║ ' + RESET + BOLD + col + badgeTxt + RESET + ' '.repeat(badgeGap) + col + ' ║' + RESET + '\r\n',
    pad + col + '╟' + sLine + '╢' + RESET + '\r\n',
    ...quoteLines.map(line => pad + col + '║ ' + RESET + BOLD + C.bwhite + line.padEnd(inner) + RESET + col + ' ║' + RESET + '\r\n'),
    pad + col + '╟' + sLine + '╢' + RESET + '\r\n',
    ...narrLines.map(line => pad + col + '║ ' + RESET + C.grey + line.padEnd(inner) + RESET + col + ' ║' + RESET + '\r\n'),
    pad + col + '╚' + hLine + '╝' + RESET + '\r\n',
  ]);
}

async function autoPlay() {
  autoPlayPhase = true;
  skipAutoPlay = false;
  animatedOutput = true;
  term.write(clearScreen());

  // 1. Hero
  await renderHeroSection();
  if (skipAutoPlay) return finishAutoPlay();
  await pause(400);

  // 2. /01 Principles
  await renderSectionHeader('/01', 'operating principles', 'from ~/.claude/CLAUDE.md');
  for (const rule of PRINCIPLES) {
    if (skipAutoPlay) return finishAutoPlay();
    await renderPrincipleCard(rule);
    await pause(220);
  }

  // 3. /02 Manifesto
  if (skipAutoPlay) return finishAutoPlay();
  await renderSectionHeader('/02', 'manifesto', 'CLAUDE.md as discipline');
  for (const line of MANIFESTO_INTRO_LINES) {
    if (skipAutoPlay) return finishAutoPlay();
    term.write('  ' + C.grey + line + RESET + '\r\n');
    await pause(line.trim() ? 60 : 110);
  }
  for (const q of MANIFESTO_QUOTES) {
    if (skipAutoPlay) return finishAutoPlay();
    await renderQuoteCard(q);
    await pause(220);
  }
  for (const line of MANIFESTO_STRUCTURE_LINES) {
    if (skipAutoPlay) return finishAutoPlay();
    term.write('  ' + C.grey + line + RESET + '\r\n');
    await pause(line.trim() ? 60 : 110);
  }

  // 4. /03 Plugins
  if (skipAutoPlay) return finishAutoPlay();
  await renderSectionHeader('/03', 'plugins', pluginsData.length + ' installable skill packs');
  for (const p of pluginsData) {
    if (skipAutoPlay) return finishAutoPlay();
    await renderPluginCard(p);
    await pause(80);
  }

  // 5. Footer
  if (skipAutoPlay) return finishAutoPlay();
  await pause(400);
  term.write('\r\n' + C.bmagenta + BOLD + '  ## aiocean//claude-plugins' + RESET + '\r\n');

async function renderPluginCard(p) {
  const cols = (term && term.cols) || 80;
  const w = Math.min(cols - 4, 84);
  const inner = w - 4;
  const pad = '  ';
  const hLine = '═'.repeat(w - 2);
  const sLine = '─'.repeat(w - 2);

  const name = (p.name || '').slice(0, Math.max(1, inner - 12));
  const ver = 'v' + (p.version || '?');
  const titleGap = Math.max(1, inner - name.length - ver.length);

  const descLines = wrapText(p.desc, inner, '').split('\r\n').slice(0, 3);

  const skills = p.skills || [];
  // installLabel() is the single source of truth — the LinkProvider regex
  // (installLabelPattern) parses output produced here, so renaming the format
  // means changing both via that helper, not editing two places.
  const installTxt = installLabel(p.name);
  const footerGap = Math.max(0, inner - installTxt.length);

  // Each skill = "▸ name" header + word-wrapped full desc lines (indented)
  const skillLines = skills.flatMap(sk => {
    const sn = (sk.name || '').slice(0, Math.max(1, inner - 4));
    const headerVis = 2 + sn.length;
    const headerPad = Math.max(0, inner - headerVis);
    const headerLine = pad + C.bmagenta + '║ ' + RESET +
      C.bgreen + '▸ ' + RESET +
      BOLD + C.bcyan + sn + RESET +
      ' '.repeat(headerPad) +
      C.bmagenta + ' ║' + RESET + '\r\n';

    const rawDesc = (sk.desc || '').replace(/\s+/g, ' ').trim();
    const wrapped = rawDesc
      ? wrapText(rawDesc, inner - 2, '').split('\r\n')
      : [];
    const descRows = wrapped.map(line => {
      const visible = '  ' + line;
      return pad + C.bmagenta + '║ ' + RESET +
        C.grey + visible.padEnd(inner) + RESET +
        C.bmagenta + ' ║' + RESET + '\r\n';
    });
    return [headerLine, ...descRows];
  });

  const lines = [
    pad + C.bmagenta + '╔' + hLine + '╗' + RESET + '\r\n',
    pad + C.bmagenta + '║ ' + RESET + BOLD + C.bmagenta + name + RESET + ' '.repeat(titleGap) + C.byellow + ver + RESET + C.bmagenta + ' ║' + RESET + '\r\n',
    pad + C.bmagenta + '╟' + sLine + '╢' + RESET + '\r\n',
    ...descLines.map(line => pad + C.bmagenta + '║ ' + RESET + C.grey + line.padEnd(inner) + RESET + C.bmagenta + ' ║' + RESET + '\r\n'),
  ];

  if (skillLines.length) {
    lines.push(pad + C.bmagenta + '╟' + sLine + '╢' + RESET + '\r\n');
    lines.push(...skillLines);
  }

  lines.push(pad + C.bmagenta + '║ ' + RESET + ' '.repeat(footerGap) + BOLD + C.bcyan + installTxt + RESET + C.bmagenta + ' ║' + RESET + '\r\n');
  lines.push(pad + C.bmagenta + '╚' + hLine + '╝' + RESET + '\r\n');

  await writeLines(lines);
}

function wrapText(text, width, indent) {
  indent = indent || '';
  const words = String(text || '').split(/\s+/);
  const lines = []; let line = '';
  for (const w of words) {
    if ((line + ' ' + w).trim().length > width) { if (line) lines.push(line); line = w; }
    else line = line ? line + ' ' + w : w;
  }
  if (line) lines.push(line);
  return lines.map(l => indent + l).join('\r\n');
}

/* ══════════════════════════════════════════════════════════════
   COMMAND DISPATCHER
   ══════════════════════════════════════════════════════════════ */
function dispatch(line) {
  const trimmed = line.trim();
  if (!trimmed) return false;
  history.push(trimmed);
  const parts = trimmed.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg = parts.slice(1).join(' ');
  switch (cmd) {
    case 'help': case '?': cmdHelp(); break;
    case 'plugins': case 'ls': case 'dir': cmdPlugins(); break;
    case 'cat': cmdCat(arg); break;
    case 'install': if (cmdInstall(arg)) return true; break;
    case 'search': case 'find': cmdSearch(arg); break;
    case 'principles': case 'rules': cmdPrinciples(); break;
    case 'manifest': case 'claude.md': case 'claudemd': cmdManifest(); break;
    case 'play': case 'replay': term.write('\r\n'); autoPlay(); return true;
    case 'theme': cmdTheme(arg.toLowerCase()); break;
    case 'clear': case 'cls': cmdClear(); break;
    case 'source': case 'repo': case 'github': cmdSource(); break;
    case 'whoami': case 'who': cmdWhoami(); break;
    case 'quit': case 'exit': cmdQuit(); break;
    default:
      term.write('\r\n' + C.bred + "Bad command or file name: " + parts[0] + RESET + '\r\n');
      term.write('  type ' + C.bcyan + 'help' + RESET + ' to see commands\r\n');
  }
  return false;
}

/* ══════════════════════════════════════════════════════════════
   INPUT HANDLER — supports printable chars, backspace, Enter,
   Ctrl+C, Ctrl+L, Up/Down history
   ══════════════════════════════════════════════════════════════ */
function handleInput(data) {
  // Modal check goes FIRST — if the modal somehow opens during BIOS or autoPlay
  // (race window: link provider fires synchronously, no phase guard before
  // openInstallModal returns false now, but defense-in-depth), we still need to
  // be able to close it. Putting modalPhase ahead of biosPhase/autoPlayPhase
  // ensures Esc/Enter/q always reach closeInstallModal.
  if (modalPhase) {
    if (data === '\x1b' || data === '\r' || data === '\n' ||
        data === 'q' || data === 'Q' || data === '\x03') {
      closeInstallModal();
    } else if (data === 'c' || data === 'C') {
      copyInstallCmds();
    }
    return; // swallow everything else while modal is up
  }
  if (biosPhase) {
    if (data === '\r' || data === '\n') biosEnterPressed();
    return;
  }
  if (autoPlayPhase) {
    if (data === '\r' || data === '\n' || data === '\x1b' || data === '\x03') {
      skipAutoPlay = true;
    }
    return;
  }
  if (!isRunning) return;
  // Handle CSI arrow sequences: ESC [ A/B/C/D
  if (data === '\x1b[A') { // up
    if (history.length === 0) return;
    if (historyIndex === -1) { savedBuffer = inputBuffer; historyIndex = history.length - 1; }
    else if (historyIndex > 0) { historyIndex--; }
    else return;
    redrawInput(history[historyIndex]);
    return;
  }
  if (data === '\x1b[B') { // down
    if (historyIndex === -1) return;
    if (historyIndex < history.length - 1) { historyIndex++; redrawInput(history[historyIndex]); }
    else { historyIndex = -1; redrawInput(savedBuffer); savedBuffer = ''; }
    return;
  }
  // Process each char (can be multi-char paste)
  for (const ch of data) {
    const code = ch.charCodeAt(0);
    if (ch === '\r' || ch === '\n') { // Enter
      const cmd = inputBuffer;
      const skipPrompt = dispatch(cmd);
      if (!skipPrompt) printPrompt();
      return;
    } else if (code === 0x7f || code === 0x08) { // Backspace or Ctrl+H
      if (inputBuffer.length > 0) {
        inputBuffer = inputBuffer.slice(0, -1);
        term.write('\b \b');
      }
    } else if (code === 0x03) { // Ctrl+C
      term.write(C.grey + '^C' + RESET);
      printPrompt();
      return;
    } else if (code === 0x0c) { // Ctrl+L
      term.write(clearScreen() + PROMPT + inputBuffer);
    } else if (code >= 0x20 && code < 0x7f) { // printable ASCII
      inputBuffer += ch;
      term.write(ch);
    }
    // silently ignore other control chars
  }
}

function redrawInput(newLine) {
  // Erase current input visually, then redraw
  const eraseLen = inputBuffer.length;
  term.write('\b \b'.repeat(eraseLen));
  inputBuffer = newLine;
  term.write(newLine);
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
async function boot() {
  try {
    // Load plugins data in parallel with WASM init
    const [_, dataResp] = await Promise.all([
      init(),
      fetch('./data.json').then(r => r.ok ? r.json() : []).catch(() => []),
    ]);
    // Defense-in-depth: filter on plugin name charset BEFORE any term.write or
    // clipboard interpolation. Blocks ANSI/shell injection if a malicious entry
    // ever lands in data.json (CI also enforces this in validate-marketplace.sh).
    const rawList = Array.isArray(dataResp) ? dataResp : [];
    pluginsData = rawList.filter(p => p && typeof p.name === 'string' && SAFE_PLUGIN_NAME.test(p.name));
    if (pluginsData.length !== rawList.length) {
      console.warn('[tui] dropped', rawList.length - pluginsData.length, 'plugin(s) with invalid names');
    }

    term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'Monaco, Menlo, "Courier New", monospace',
      theme: currentTheme(),
      // ghostty-web's `scrollback` is forwarded to the WASM core's
      // `scrollbackLimit`, measured in BYTES. The WASM default (10000
      // bytes) is barely a screenful — autoPlay overflows scrollback
      // and BIOS POST + early plugins evict before the user can scroll
      // back to read them. Match Ghostty desktop's 10 MiB default.
      // ref: https://ghostty.org/docs/config/reference#scrollback-limit
      scrollback: 10 * 1024 * 1024,
    });
    const fitAddon = new FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('ghostty-terminal'));
    fitAddon.fit();
    fitAddon.observeResize();
    window.addEventListener('resize', () => {
      fitAddon.fit();
      // Alt-screen modal must redraw after fit() recomputes cols/rows.
      // drawInstallModal() reads modalCopyState directly, so the "✓ copied"
      // feedback survives a resize.
      if (modalPhase) drawInstallModal();
    });

    term.onData(handleInput);
    term.focus();

    // Click-to-install: detect "[ install <name> ]" buttons inside plugin cards.
    // Custom provider — bare click activates (built-ins gate on Ctrl/Cmd, but
    // landing-page UX wants single-click). Pattern lives in installLabelPattern()
    // so render and detection can never desync.
    //
    // hover() drives the magenta DOS cursor — `cursor: none !important` on the
    // page blocks ghostty's native pointer-cursor swap, so we visualize hover
    // ourselves via a CSS class on #dos-cursor.
    installLinkDisposable = term.registerLinkProvider({
      provideLinks(y, callback) {
        const line = term.buffer.active.getLine(y);
        if (!line) { callback(undefined); return; }
        const text = line.translateToString(false);
        const re = installLabelPattern();
        const links = [];
        let m;
        while ((m = re.exec(text)) !== null) {
          const name = m[1];
          const startX = m.index;
          const endX = m.index + m[0].length - 1;
          links.push({
            text: m[0],
            range: { start: { x: startX, y: y }, end: { x: endX, y: y } },
            activate: () => openInstallModal(name, false),
            hover: (isHovered) => {
              installLinkHovers += isHovered ? 1 : -1;
              if (installLinkHovers < 0) installLinkHovers = 0;
              const el = dosCursorEl();
              if (el) el.classList.toggle('over-link', installLinkHovers > 0);
            },
          });
        }
        callback(links.length ? links : undefined);
      },
    });

    // BIOS POST phase — once per session unless ?reboot
    const forceReboot = /[?&]reboot(=|&|$)/.test(location.search);
    if (forceReboot) { try { sessionStorage.removeItem('dos-booted'); } catch (e) {} }
    let alreadyBooted = false;
    try { alreadyBooted = sessionStorage.getItem('dos-booted') === '1'; } catch (e) {}
    if (!alreadyBooted) {
      await renderBIOS();
      try { sessionStorage.setItem('dos-booted', '1'); } catch (e) {}
    }
    await autoPlay();
  } catch (err) {
    console.error('[tui] boot failed:', err);
    const el = document.getElementById('ghostty-terminal');
    if (el) el.innerHTML = '<pre style="color:#ff5555;padding:20px;font:14px monospace;">TUI boot failed. see console.\n\n' + String(err).replace(/[<>&]/g,'') + '</pre>';
  }
}

/* Theme sync with page-level attribute changes */
const themeObserver = new MutationObserver(() => {
  if (term) {
    try { term.options.theme = currentTheme(); }
    catch (e) { console.warn('[tui] theme sync failed:', e); }
  }
});
themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* F-key shortcuts + Shift+D theme toggle */
document.addEventListener('keydown', (e) => {
  if (!term || !isRunning) return;
  // Modal owns all input — F-keys would otherwise re-trigger autoPlay/quit on
  // top of the alt screen, leaving the user in a corrupted state.
  if (modalPhase) return;
  // Shift+D toggles theme — only when input buffer empty (avoid wiping mid-command)
  if ((e.key === 'D' || e.key === 'd') && e.shiftKey && !e.ctrlKey && !e.metaKey && inputBuffer.length === 0) {
    e.preventDefault();
    cmdTheme('');
    printPrompt();
    return;
  }
  // F-keys: map to commands
  const fKeyMap = {
    F1:  () => cmdHelp(),
    F3:  () => cmdPlugins(),
    F5:  () => autoPlay(),
    F8:  () => cmdTheme(''),
    F10: () => cmdQuit(),
  };
  if (fKeyMap[e.key]) {
    e.preventDefault();
    if (e.key === 'F5') { /* replay runs full autoplay, includes own prompt */ fKeyMap[e.key](); return; }
    fKeyMap[e.key]();
    if (isRunning) printPrompt();
  }
});

/* Persist theme from localStorage */
try {
  const saved = localStorage.getItem('nsct-theme');
  if (saved === 'void' || saved === 'signal') document.documentElement.setAttribute('data-theme', saved);
} catch (e) {}

/* ══════════════════════════════════════════════════════════════
   CUSTOM DOS BLOCK CURSOR — snaps to character grid, blinks once moved
   cursor snaps to terminal cell (floor of mouse / cellSize) so it
   jumps line-by-line like an MS-DOS text-mode pointer, never free-floats
   ══════════════════════════════════════════════════════════════ */
const dosCursor = document.getElementById('dos-cursor');
let dosCursorStarted = false;
// fallback derived from Terminal config (fontSize: 14) — overridden by measureCell when term DOM ready
let cellW = 14 * 0.6, cellH = 14 * 1.2;
let cellOriginX = 0, cellOriginY = 0;

function measureCell() {
  if (!term || !term.cols || !term.rows) return;
  const container = document.getElementById('ghostty-terminal');
  if (!container) return;
  // ghostty-web renders into a <canvas>; measure that for cell size.
  // Fall back to the container if the canvas hasn't mounted yet.
  const el = container.querySelector('canvas') || container;
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return;
  cellW = r.width / term.cols;
  cellH = r.height / term.rows;
  cellOriginX = r.left;
  cellOriginY = r.top;
  dosCursor.style.width  = cellW + 'px';
  dosCursor.style.height = cellH + 'px';
}

let measured = false;
window.addEventListener('resize', () => { measured = false; }, { passive: true });

document.addEventListener('mousemove', (e) => {
  if (!measured) { measureCell(); measured = true; }
  if (!dosCursorStarted) { dosCursor.classList.add('active'); dosCursorStarted = true; }
  const gx = Math.floor((e.clientX - cellOriginX) / cellW);
  const gy = Math.floor((e.clientY - cellOriginY) / cellH);
  const x = cellOriginX + gx * cellW;
  const y = cellOriginY + gy * cellH;
  dosCursor.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
}, { passive: true });

/* Start boot sequence (WASM load → BIOS POST in terminal → welcome) */
boot();
</script>
</body>
</html>
