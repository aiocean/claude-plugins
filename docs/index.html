<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aiocean — Claude Code Plugins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1a1a1a;
    --border: #262626;
    --border-hover: #333;
    --text: #ededed;
    --text-2: #a1a1a1;
    --text-3: #666;
    --accent: #00e5a0;
    --accent-dim: rgba(0, 229, 160, 0.08);
    --accent-border: rgba(0, 229, 160, 0.25);
    --blue: #3b82f6;
    --amber: #f59e0b;
    --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }

  header { margin-bottom: 2rem; }

  .logo {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 0.75rem;
  }

  header h1 {
    font-family: var(--sans);
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 0.5rem;
  }

  header p {
    color: var(--text-2);
    font-size: 0.9rem;
  }

  .config-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem 1rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    backdrop-filter: blur(16px);
    background: rgba(20, 20, 20, 0.9);
  }

  .config-bar .left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex: 1;
    min-width: 0;
  }

  .config-bar .count {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text-2);
    white-space: nowrap;
  }

  .config-bar .count strong { color: var(--accent); }

  .config-bar .actions {
    display: flex;
    gap: 0.4rem;
    flex-shrink: 0;
  }

  button {
    font-family: var(--mono);
    font-size: 0.75rem;
    font-weight: 500;
    padding: 0.4rem 0.75rem;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    transition: all 0.12s;
    letter-spacing: 0.01em;
  }

  button:hover {
    border-color: var(--border-hover);
    color: var(--text);
  }

  button.primary {
    background: var(--accent);
    color: #0a0a0a;
    border-color: var(--accent);
    font-weight: 600;
  }

  button.primary:hover {
    background: #00ffb2;
    border-color: #00ffb2;
  }

  button.primary:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    background: var(--accent);
    border-color: var(--accent);
  }

  button.ghost {
    background: transparent;
    border-color: transparent;
  }

  button.ghost:hover {
    background: var(--surface-2);
    border-color: var(--border);
  }

  .category { margin-bottom: 1.25rem; }

  .category-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 0;
    margin-bottom: 0.25rem;
  }

  .category-header h2 {
    font-family: var(--mono);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .category-header button {
    font-size: 0.7rem;
    padding: 0.2rem 0.5rem;
    border-color: transparent;
    background: transparent;
  }

  .plugin {
    display: flex;
    align-items: flex-start;
    gap: 0.65rem;
    padding: 0.6rem 0.75rem;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.12s;
    border: 1px solid transparent;
  }

  .plugin:hover { background: var(--surface); }
  .plugin.selected { background: var(--surface); }
  .plugin.selected .plugin-name { color: var(--accent); }

  .plugin input[type="checkbox"] {
    appearance: none;
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--border-hover);
    border-radius: 3px;
    margin-top: 2px;
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
    transition: all 0.12s;
    background: var(--bg);
  }

  .plugin input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .plugin input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 3.5px;
    top: 0.5px;
    width: 5px;
    height: 9px;
    border: solid #0a0a0a;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .plugin-info { flex: 1; min-width: 0; }

  .plugin-top {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .plugin-name {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text);
  }

  .plugin-version {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-3);
  }

  .plugin-desc {
    font-size: 0.82rem;
    color: var(--text-2);
    margin-top: 0.1rem;
    line-height: 1.45;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 100%;
    max-width: 680px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
  }

  .modal-header h3 {
    font-family: var(--mono);
    font-size: 0.9rem;
    font-weight: 600;
  }

  .modal-header .close {
    background: none;
    border: none;
    color: var(--text-3);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }

  .modal-header .close:hover { color: var(--text); }

  .modal-body {
    padding: 1.25rem;
    overflow-y: auto;
    flex: 1;
  }

  .hint {
    font-size: 0.8rem;
    color: var(--text-3);
    margin-bottom: 0.75rem;
  }

  .modal-body pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    font-family: var(--mono);
    font-size: 0.78rem;
    line-height: 1.75;
    overflow-x: auto;
    white-space: pre;
    color: var(--text);
  }

  .modal-body pre .comment { color: var(--text-3); }

  .modal-footer {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
    padding: 0.75rem 1.25rem;
    border-top: 1px solid var(--border);
  }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: #0a0a0a;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.8rem;
    font-weight: 600;
    opacity: 0;
    transition: all 0.25s;
    z-index: 300;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  footer {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--text-3);
  }

  footer a {
    font-family: var(--mono);
    color: var(--text-2);
    text-decoration: none;
  }

  footer a:hover { color: var(--accent); }

  .search-bar { margin-bottom: 0.75rem; }

  .search-bar input {
    width: 100%;
    font-family: var(--mono);
    font-size: 0.85rem;
    padding: 0.6rem 0.75rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.12s;
  }

  .search-bar input::placeholder { color: var(--text-3); }
  .search-bar input:focus { border-color: var(--accent); }

  .category.hidden { display: none; }
  .plugin.hidden { display: none; }

  @media (max-width: 640px) {
    .container { padding: 2rem 1rem 3rem; }
    header h1 { font-size: 1.4rem; }
    .config-bar { padding: 0.6rem 0.75rem; gap: 0.5rem; }
    .config-bar .left { flex-wrap: wrap; }
    footer { flex-direction: column; gap: 0.5rem; text-align: center; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">aiocean/claude-plugins</div>
    <h1>Plugin Marketplace</h1>
    <p>Select plugins, configure scope, generate install script.</p>
  </header>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="search plugins..." oninput="filterPlugins()">
  </div>

  <div class="config-bar">
    <div class="left">
      <span class="count"><strong id="selectedCount">0</strong> selected</span>
    </div>
    <div class="actions">
      <button class="ghost" onclick="selectAll()">all</button>
      <button class="ghost" onclick="clearAll()">clear</button>
      <button class="primary" id="generateBtn" onclick="openModal()" disabled>generate</button>
    </div>
  </div>

  <div id="pluginList"></div>

  <footer>
    <a href="https://github.com/aiocean/claude-plugins">github.com/aiocean/claude-plugins</a>
    <span>MIT</span>
  </footer>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3>install script</h3>
      <button class="close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p class="hint">Run each command in your terminal:</p>
      <pre id="scriptOutput"></pre>
    </div>
    <div class="modal-footer">
      <button onclick="closeModal()">close</button>
      <button class="primary" onclick="copyScript()">copy</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">copied</div>

<script>
const MARKETPLACE = 'aiocean-plugins';

const PLUGINS = [
  {
    category: "Toolkits",
    plugins: [
      { name: "aio-planning", version: "1.0.0", desc: "Code analysis & planning — 9 skills: codebase-oracle (GitNexus + doc-writer), deep-plan (discover/map/plan/review/snapshot), debug (4-phase pipeline), code-review (multi-agent with critic)." },
      { name: "aio-claude-toolkit", version: "1.0.0", desc: "Claude Code management — 6 skills: claude-manager (enable/disable skills), install (plugin management), reflect (session learnings), dream (memory consolidation), skillify (capture workflows), feedback." },
      { name: "aio-devops", version: "1.0.0", desc: "DevOps toolkit — 3 skills: github (repos, PRs, issues via MCP), gitlab (MRs, pipelines via MCP), worktree (git worktree management for parallel development)." },
      { name: "aio-design-system", version: "1.0.0", desc: "UI/UX design — 3 skills: uiux (comprehensive design knowledge), neobrutalism (design system bootstrapper), react-minimal-effects (minimize useEffect in React 19)." },
      { name: "aio-saas-tools", version: "1.0.0", desc: "SaaS integrations — 4 skills: atlassian (Jira + Confluence CLI), google-workspace (Drive, Gmail, Calendar, Sheets, Docs), tanca (HR/timekeeping), x (X/Twitter)." },
      { name: "aio-research", version: "1.0.0", desc: "Research toolkit — 2 skills: research-kit (structured 10-phase research), rag-kit (Qdrant vector database for semantic search)." },
      { name: "aio-diagramming", version: "1.0.0", desc: "Diagram generation — 2 skills: mermaid (shareable MinimalMermaid URLs), grafana-diagram (auto-generate dashboard diagrams from codebase)." }
    ]
  },
  {
    category: "Content & Translation",
    plugins: [
      { name: "aio-epub-translate", version: "3.5.1", desc: "EPUB book translation via ConnectRPC API — 9 skills: analyze, translate, review, quality, manage, upload, export, setup, vn-style guide." },
      { name: "aio-youtube", version: "1.1.3", desc: "Search YouTube and extract video transcripts using yt-dlp." },
      { name: "aio-mental-models", version: "2.1.3", desc: "Decision advisor using 50+ mental models. Guides through selection, application, synthesis, and stress-testing." },
      { name: "aio-gherkin-refine", version: "2.0.2", desc: "BDD field guide — writes and reviews Gherkin with expert quality. Example Mapping, 3 Amigos, anti-patterns catalog." }
    ]
  },
  {
    category: "Language & Framework",
    plugins: [
      { name: "aio-golang-mastery", version: "1.1.1", desc: "Complete Go development with lint mode: 7-step tooling chain (build, vet, golangci-lint, govulncheck, nilaway, deadcode, race). Google/Uber style." },
      { name: "aio-xstate", version: "1.0.6", desc: "XState v5 strict ruleset: setup().createMachine() patterns, design-first workflow, actor types, React integration." },
      { name: "aio-tui", version: "1.0.5", desc: "Go Bubbletea TUI guide: TEA architecture, lipgloss styling, production patterns." },
      { name: "aio-bun-fullstack-setup", version: "1.1.1", desc: "Scaffold Bun fullstack apps. Detects existing files, generates only what's missing: single-port server, Vite proxy, PM2, Docker." }
    ]
  },
  {
    category: "Platform & Browser",
    plugins: [
      { name: "aio-ios-device-debug", version: "1.1.4", desc: "Debug iOS apps on physical devices. Build, install, launch, capture logs, pull crash reports, take screenshots." },
      { name: "aio-cdp-relay", version: "1.2.2", desc: "Persistent Chrome DevTools Protocol relay for browser automation via scripts — no MCP tool calls, no approval prompts." },
      { name: "aio-browser-cookie", version: "2.0.3", desc: "Extract browser cookies with rookiepy. Export Netscape files, replay authenticated requests." }
    ]
  },
  {
    category: "Observability & Utilities",
    plugins: [
      { name: "aio-monitoring-observability", version: "1.0.7", desc: "Full monitoring stack: Golden Signals, RED/USE, OpenTelemetry, SLOs, dashboards, alerting. 7 automation scripts." },
      { name: "aio-remove-bg", version: "1.1.4", desc: "Remove background from images. Supports threshold-based (fast) and AI-based (rembg) methods." }
    ]
  }
];

const selected = new Set();

function buildCmd(pluginName) {
  return `claude plugin install --scope project ${pluginName}@${MARKETPLACE}`;
}

function render() {
  const container = document.getElementById('pluginList');
  container.innerHTML = PLUGINS.map(cat => `
    <div class="category">
      <div class="category-header">
        <h2>${cat.category}</h2>
        <button class="ghost" onclick="toggleCategory('${cat.category}')">toggle</button>
      </div>
      ${cat.plugins.map(p => `
        <label class="plugin ${selected.has(p.name) ? 'selected' : ''}" id="card-${p.name}">
          <input type="checkbox" ${selected.has(p.name) ? 'checked' : ''}
                 onchange="toggle('${p.name}')">
          <div class="plugin-info">
            <div class="plugin-top">
              <span class="plugin-name">${p.name}</span>
              <span class="plugin-version">${p.version}</span>
            </div>
            <div class="plugin-desc">${p.desc}</div>
          </div>
        </label>
      `).join('')}
    </div>
  `).join('');
  updateBar();
}

function toggle(name) {
  if (selected.has(name)) selected.delete(name);
  else selected.add(name);
  const card = document.getElementById('card-' + name);
  if (card) card.classList.toggle('selected', selected.has(name));
  updateBar();
}

function toggleCategory(catName) {
  const cat = PLUGINS.find(c => c.category === catName);
  if (!cat) return;
  const allSelected = cat.plugins.every(p => selected.has(p.name));
  cat.plugins.forEach(p => {
    if (allSelected) selected.delete(p.name);
    else selected.add(p.name);
  });
  render();
}

function selectAll() {
  PLUGINS.forEach(cat => cat.plugins.forEach(p => selected.add(p.name)));
  render();
}

function clearAll() {
  selected.clear();
  render();
}

function updateBar() {
  document.getElementById('selectedCount').textContent = selected.size;
  document.getElementById('generateBtn').disabled = selected.size === 0;
}

function getSelectedPlugins() {
  const ordered = [];
  PLUGINS.forEach(cat => cat.plugins.forEach(p => {
    if (selected.has(p.name)) ordered.push(p.name);
  }));
  return ordered;
}

function generateScript() {
  const plugins = getSelectedPlugins();
  let out = `<span class="comment">#!/bin/bash</span>\n`;
  out += `<span class="comment"># Install aiocean plugins for Claude Code</span>\n\n`;
  out += plugins.map(name => buildCmd(name)).join('\n') + '\n';
  return out;
}

function generatePlainScript() {
  const plugins = getSelectedPlugins();
  let out = `#!/bin/bash\n`;
  out += `# Install aiocean plugins for Claude Code\n\n`;
  out += plugins.map(name => buildCmd(name)).join('\n') + '\n';
  return out;
}

function openModal() {
  if (selected.size === 0) return;
  document.getElementById('scriptOutput').innerHTML = generateScript();
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function copyScript() {
  navigator.clipboard.writeText(generatePlainScript()).then(() => showToast('copied'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function filterPlugins() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  document.querySelectorAll('.category').forEach(catEl => {
    const plugins = catEl.querySelectorAll('.plugin');
    let visible = 0;
    plugins.forEach(p => {
      const name = p.querySelector('.plugin-name').textContent.toLowerCase();
      const desc = p.querySelector('.plugin-desc').textContent.toLowerCase();
      const match = !q || name.includes(q) || desc.includes(q);
      p.classList.toggle('hidden', !match);
      if (match) visible++;
    });
    catEl.classList.toggle('hidden', visible === 0);
  });
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

render();
</script>

</body>
</html>
