<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aiocean — Claude Code Plugins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1a1a1a;
    --border: #262626;
    --border-hover: #333;
    --text: #ededed;
    --text-2: #a1a1a1;
    --text-3: #666;
    --accent: #00e5a0;
    --accent-dim: rgba(0, 229, 160, 0.08);
    --accent-border: rgba(0, 229, 160, 0.25);
    --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }

  header { margin-bottom: 2rem; }

  .logo {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 0.75rem;
  }

  header h1 {
    font-family: var(--sans);
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 0.5rem;
  }

  header p {
    color: var(--text-2);
    font-size: 0.9rem;
  }

  .setup-cmd {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 1rem;
    margin-bottom: 1rem;
    border: 1px solid var(--accent-border);
    border-radius: var(--radius);
    background: var(--accent-dim);
    cursor: pointer;
    transition: all 0.12s;
  }

  .setup-cmd:hover {
    border-color: var(--accent);
    background: var(--accent-border);
  }

  .setup-cmd .setup-label {
    font-family: var(--mono);
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .setup-cmd code {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text);
    flex: 1;
  }

  .setup-cmd .setup-copy {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-3);
    padding: 0.15rem 0.4rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    white-space: nowrap;
  }

  .setup-cmd:hover .setup-copy {
    color: var(--text);
    border-color: var(--border-hover);
  }

  .search-bar { margin-bottom: 1.25rem; }

  .search-bar input {
    width: 100%;
    font-family: var(--mono);
    font-size: 0.85rem;
    padding: 0.6rem 0.75rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.12s;
  }

  .search-bar input::placeholder { color: var(--text-3); }
  .search-bar input:focus { border-color: var(--accent); }

  .category { margin-bottom: 1.5rem; }

  .category-header {
    padding: 0.5rem 0;
    margin-bottom: 0.25rem;
  }

  .category-header h2 {
    font-family: var(--mono);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .plugin {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.75rem;
    border-radius: var(--radius);
    transition: all 0.12s;
    border: 1px solid transparent;
  }

  .plugin:hover { background: var(--surface); }

  .plugin.has-skills {
    border: 1px solid var(--border);
    background: var(--surface);
    margin-bottom: 0.25rem;
  }

  .plugin.has-skills:hover {
    border-color: var(--border-hover);
  }

  .plugin-info { flex: 1; min-width: 0; }

  .plugin-top {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .plugin-name {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text);
  }

  .plugin-version {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-3);
  }

  .plugin-desc {
    font-size: 0.82rem;
    color: var(--text-2);
    margin-top: 0.15rem;
    line-height: 1.45;
  }

  .plugin:not(.has-skills) .plugin-desc {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .install-btn {
    font-family: var(--mono);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.35rem 0.65rem;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-2);
    transition: all 0.12s;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .install-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }

  .install-btn.copied {
    border-color: var(--accent);
    background: var(--accent);
    color: #0a0a0a;
  }

  .skill-count {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    border: 1px solid var(--accent-border);
    cursor: pointer;
    transition: all 0.12s;
    user-select: none;
  }

  .skill-count:hover {
    background: var(--accent-border);
  }

  .skill-count::after {
    content: ' \25BE';
    font-size: 0.65rem;
  }

  .skill-count.open::after {
    content: ' \25B4';
  }

  .skills-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
    margin-top: 0.25rem;
  }

  .skills-list.open { max-height: 600px; }

  .skill-item {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    padding: 0.2rem 0;
    font-size: 0.78rem;
    color: var(--text-2);
    border-left: 1px solid var(--border);
    padding-left: 0.75rem;
    margin-left: 0.25rem;
  }

  .skill-item-name {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--accent);
    white-space: nowrap;
    opacity: 0.85;
  }

  .skill-item-desc {
    color: var(--text-3);
    font-size: 0.75rem;
  }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: #0a0a0a;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.8rem;
    font-weight: 600;
    opacity: 0;
    transition: all 0.25s;
    z-index: 300;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  footer {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--text-3);
  }

  footer a {
    font-family: var(--mono);
    color: var(--text-2);
    text-decoration: none;
  }

  footer a:hover { color: var(--accent); }

  .category.hidden { display: none; }
  .plugin.hidden { display: none; }

  @media (max-width: 640px) {
    .container { padding: 2rem 1rem 3rem; }
    header h1 { font-size: 1.4rem; }
    .setup-cmd { flex-wrap: wrap; }
    .setup-cmd code { font-size: 0.7rem; }
    footer { flex-direction: column; gap: 0.5rem; text-align: center; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">aiocean/claude-plugins</div>
    <h1>Plugin Marketplace</h1>
    <p>Browse plugins and copy install commands.</p>
  </header>

  <div class="setup-cmd" onclick="copySetup()" title="Click to copy">
    <span class="setup-label">setup</span>
    <code>claude plugin marketplace add aiocean/claude-plugins</code>
    <span class="setup-copy">copy</span>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="search plugins..." oninput="filterPlugins()">
  </div>

  <div id="pluginList"></div>

  <footer>
    <a href="https://github.com/aiocean/claude-plugins">github.com/aiocean/claude-plugins</a>
    <span>MIT</span>
  </footer>
</div>

<div class="toast" id="toast">copied</div>

<script>
const MARKETPLACE = 'aiocean-plugins';

const PLUGINS = [
  {
    category: "Toolkits",
    plugins: [
      { name: "aio-planning", version: "1.0.0", desc: "Code analysis & planning — 9 skills for codebase understanding, debugging, and review.", skills: [
        { name: "aio-gitnexus", desc: "GitNexus knowledge graph — index and query codebase structure" },
        { name: "doc-writer", desc: "Generate architecture docs, module docs, and HTML viewers" },
        { name: "discover", desc: "Find relevant code for a feature or concept" },
        { name: "map", desc: "Structural analysis — dependencies, blast radius, call graphs" },
        { name: "plan", desc: "Implementation planning with re-anchoring" },
        { name: "review", desc: "Plan review and validation" },
        { name: "snapshot", desc: "Baseline snapshot for change tracking" },
        { name: "aio-debug", desc: "4-phase debug pipeline: context, root cause, fix, review" },
        { name: "aio-code-review", desc: "Multi-agent code review with critic meta-review" }
      ]},
      { name: "aio-claude-toolkit", version: "1.0.0", desc: "Claude Code management — 6 skills for skill management, learning, and feedback.", skills: [
        { name: "aio-claude-manager", desc: "Enable/disable skills by project context, apply presets" },
        { name: "aio-install", desc: "Browse, install, enable/disable aiocean plugins" },
        { name: "aio-reflect", desc: "Extract reusable knowledge from past sessions" },
        { name: "aio-dream", desc: "Consolidate and organize memory files" },
        { name: "aio-skillify", desc: "Capture repeatable workflows as reusable skills" },
        { name: "feedback", desc: "Submit bug reports and feature requests via GitHub Issues" }
      ]},
      { name: "aio-devops", version: "1.0.0", desc: "DevOps toolkit — 3 skills for Git platform management and parallel development.", skills: [
        { name: "aio-github", desc: "GitHub repos, PRs, issues, code review via MCP" },
        { name: "aio-gitlab", desc: "GitLab MRs, pipelines, jobs, branch protection via MCP" },
        { name: "aio-worktree", desc: "Git worktree management for parallel development" }
      ]},
      { name: "aio-design-system", version: "1.0.0", desc: "UI/UX design — 3 skills for design knowledge, systems, and React optimization.", skills: [
        { name: "aio-uiux", desc: "Comprehensive UI/UX design knowledge — 100+ topics, WCAG 2.2, UX laws" },
        { name: "aio-neobrutalism", desc: "Neobrutalism design system bootstrapper — CSS tokens, component transforms" },
        { name: "aio-react-minimal-effects", desc: "Minimize useEffect in React 19 — scan mode with file:line refs" }
      ]},
      { name: "aio-saas-tools", version: "1.0.0", desc: "SaaS integrations — 4 skills for Atlassian, Google, HR, and social.", skills: [
        { name: "aio-atlassian", desc: "Jira issues, sprints, workflows + Confluence pages via CLI" },
        { name: "aio-google-workspace", desc: "Drive, Gmail, Calendar, Sheets, Docs, Tasks via gws CLI" },
        { name: "aio-tanca", desc: "Employee timekeeping, shifts, check-in/check-out via MCP" },
        { name: "aio-x", desc: "X/Twitter tweets, threads, search, engagement via MCP" }
      ]},
      { name: "aio-research", version: "1.0.0", desc: "Research toolkit — 2 skills for structured research and vector search.", skills: [
        { name: "aio-research-kit", desc: "Structured 10-phase research framework" },
        { name: "aio-rag-kit", desc: "Qdrant vector database — index, search, semantic queries" }
      ]},
      { name: "aio-diagramming", version: "1.0.0", desc: "Diagram generation — 2 skills for Mermaid and Grafana diagrams.", skills: [
        { name: "aio-mermaid", desc: "Generate shareable MinimalMermaid diagram URLs" },
        { name: "aio-grafana-diagram", desc: "Auto-generate Mermaid diagrams with metric binding for Grafana" }
      ]}
    ]
  },
  {
    category: "Content & Translation",
    plugins: [
      { name: "aio-epub-translate", version: "3.5.1", desc: "EPUB book translation via ConnectRPC API — 9 skills for the full translation pipeline.", skills: [
        { name: "aio-epub-setup", desc: "Account registration, license, API key configuration" },
        { name: "aio-epub-upload", desc: "Upload and prepare EPUB books for translation" },
        { name: "aio-epub-analyze", desc: "Pre-translation analysis — style, characters, glossary" },
        { name: "aio-epub-translate", desc: "Literary translation with batch API, edit & update" },
        { name: "aio-epub-review", desc: "Deep literary review with quality scoring" },
        { name: "aio-epub-quality", desc: "Mechanical quality detection and re-translation" },
        { name: "aio-epub-manage", desc: "Browse, progress, guidelines, community, fork, reset" },
        { name: "aio-epub-export", desc: "Pack and export — bilingual or translation-only EPUB" },
        { name: "aio-epub-vn-style", desc: "Vietnamese literary translation style guide" }
      ]},
      { name: "aio-youtube", version: "1.1.3", desc: "Search YouTube and extract video transcripts using yt-dlp." },
      { name: "aio-mental-models", version: "2.1.3", desc: "Decision advisor using 50+ mental models. Guides through selection, application, synthesis, and stress-testing." },
      { name: "aio-gherkin-refine", version: "2.0.2", desc: "BDD field guide — writes and reviews Gherkin with expert quality. Example Mapping, 3 Amigos, anti-patterns catalog." }
    ]
  },
  {
    category: "Language & Framework",
    plugins: [
      { name: "aio-golang-mastery", version: "1.1.1", desc: "Complete Go development with lint mode: 7-step tooling chain (build, vet, golangci-lint, govulncheck, nilaway, deadcode, race). Google/Uber style." },
      { name: "aio-xstate", version: "1.0.6", desc: "XState v5 strict ruleset: setup().createMachine() patterns, design-first workflow, actor types, React integration." },
      { name: "aio-tui", version: "1.0.5", desc: "Go Bubbletea TUI guide: TEA architecture, lipgloss styling, production patterns." },
      { name: "aio-bun-fullstack-setup", version: "1.1.1", desc: "Scaffold Bun fullstack apps. Detects existing files, generates only what's missing: single-port server, Vite proxy, PM2, Docker." }
    ]
  },
  {
    category: "Platform & Browser",
    plugins: [
      { name: "aio-ios-device-debug", version: "1.1.4", desc: "Debug iOS apps on physical devices. Build, install, launch, capture logs, pull crash reports, take screenshots." },
      { name: "aio-cdp-relay", version: "1.2.2", desc: "Persistent Chrome DevTools Protocol relay for browser automation via scripts — no MCP tool calls, no approval prompts." },
      { name: "aio-browser-cookie", version: "2.0.3", desc: "Extract browser cookies with rookiepy. Export Netscape files, replay authenticated requests." }
    ]
  },
  {
    category: "Observability & Utilities",
    plugins: [
      { name: "aio-monitoring-observability", version: "1.0.7", desc: "Full monitoring stack: Golden Signals, RED/USE, OpenTelemetry, SLOs, dashboards, alerting. 7 automation scripts." },
      { name: "aio-remove-bg", version: "1.1.4", desc: "Remove background from images. Supports threshold-based (fast) and AI-based (rembg) methods." }
    ]
  }
];

function installCmd(name) {
  return `claude plugin install ${name}@${MARKETPLACE}`;
}

function copyInstall(name, btn) {
  navigator.clipboard.writeText(installCmd(name)).then(() => {
    btn.textContent = 'copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'install';
      btn.classList.remove('copied');
    }, 1500);
  });
}

function copySetup() {
  navigator.clipboard.writeText('claude plugin marketplace add aiocean/claude-plugins').then(() => showToast('copied'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function toggleSkills(name) {
  const el = document.getElementById('skills-' + name);
  const badge = document.getElementById('badge-' + name);
  if (el) {
    el.classList.toggle('open');
    if (badge) badge.classList.toggle('open');
  }
}

function render() {
  const container = document.getElementById('pluginList');
  container.innerHTML = PLUGINS.map(cat => `
    <div class="category">
      <div class="category-header">
        <h2>${cat.category}</h2>
      </div>
      ${cat.plugins.map(p => `
        <div class="plugin${p.skills ? ' has-skills' : ''}">
          <div class="plugin-info">
            <div class="plugin-top">
              <span class="plugin-name">${p.name}</span>
              <span class="plugin-version">${p.version}</span>
              ${p.skills ? `<span class="skill-count" id="badge-${p.name}" onclick="toggleSkills('${p.name}')">${p.skills.length} skills</span>` : ''}
            </div>
            <div class="plugin-desc">${p.desc}</div>
            ${p.skills ? `
              <div class="skills-list" id="skills-${p.name}">
                ${p.skills.map(s => `
                  <div class="skill-item">
                    <span class="skill-item-name">${s.name}</span>
                    <span class="skill-item-desc">${s.desc}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
          <button class="install-btn" onclick="copyInstall('${p.name}', this)">install</button>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function filterPlugins() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  document.querySelectorAll('.category').forEach(catEl => {
    const plugins = catEl.querySelectorAll('.plugin');
    let visible = 0;
    plugins.forEach(p => {
      const name = p.querySelector('.plugin-name').textContent.toLowerCase();
      const desc = p.querySelector('.plugin-desc').textContent.toLowerCase();
      const match = !q || name.includes(q) || desc.includes(q);
      p.classList.toggle('hidden', !match);
      if (match) visible++;
    });
    catEl.classList.toggle('hidden', visible === 0);
  });
}

render();
</script>

</body>
</html>
