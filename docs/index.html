<html lang="en" data-theme="signal">
<head>
<meta charset="utf-8">

<title>duoc // claude playbook · aiocean/claude-plugins</title>

<style>
/* ════════════════════════════════════════════════════════════════
   MS-DOS TERMINAL MODE · CP437 · VGA 16-color · CRT scanlines
   signal = green-on-black (default DOS)
   void   = amber-on-black (monochrome CRT alt)
   ════════════════════════════════════════════════════════════════ */
:root, [data-theme="signal"] {
  --bg:        #000000;
  --bg-2:      #000000;
  --bg-3:      #0a0f0a;
  --ink:       #c0c0c0;
  --ink-dim:   #a8a8a8;
  --ink-mute:  #555555;
  --line:      #c0c0c0;

  --lime:      #55ff55;   /* DOS bright green  #10 */
  --lime-2:    #00aa00;   /* DOS green         #02 */
  --magenta:   #ff55ff;   /* DOS bright mag    #13 */
  --magenta-2: #aa00aa;   /* DOS magenta       #05 */
  --cyan:      #55ffff;   /* DOS bright cyan   #11 */
  --cyan-2:    #00aaaa;   /* DOS cyan          #03 */
  --amber:     #ffff55;   /* DOS yellow        #14 */
  --amber-2:   #aa5500;   /* DOS brown         #06 */
  --red:       #ff5555;   /* DOS bright red    #12 */
  --blue:      #5555ff;   /* DOS bright blue   #09 */
  --white:     #ffffff;

  --grid-tint:    rgba(85,255,85,0.025);
  --scan-opacity: 0.26;

  --f-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Menlo', 'Monaco', 'Courier New', monospace;
  --f-vga:  'VT323', 'IBM Plex Mono', 'Courier New', monospace;
}

[data-theme="void"] {
  --bg:        #0c0600;
  --bg-2:      #110a02;
  --bg-3:      #1a0e04;
  --ink:       #ffb86b;
  --ink-dim:   #d4924b;
  --ink-mute:  #6b4420;
  --line:      #ffb86b;

  --lime:      #ffaa00;
  --lime-2:    #aa6600;
  --magenta:   #ff8844;
  --magenta-2: #cc6622;
  --cyan:      #ffcc88;
  --cyan-2:    #bb8844;
  --amber:     #ffd866;
  --amber-2:   #aa6600;
  --red:       #ff5555;
  --blue:      #ffaa00;
  --white:     #fff3d0;

  --grid-tint:    rgba(255,184,107,0.03);
  --scan-opacity: 0.22;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-mono);
  font-size: 14px;
  line-height: 1.4;
  height: 100vh;
  overflow: hidden;
}
::selection { background: var(--lime); color: #000; }

/* subtle grid tint */
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    repeating-linear-gradient(0deg,  transparent 0 19px, var(--grid-tint) 19px 20px),
    repeating-linear-gradient(90deg, transparent 0 19px, var(--grid-tint) 19px 20px);
  pointer-events: none;
  z-index: 0;
}

/* CRT scanlines — aggressive on top of terminal for the TUI feel */
body::after {
  content: "";
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,var(--scan-opacity)) 0,
    rgba(0,0,0,var(--scan-opacity)) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
  z-index: 5;
  mix-blend-mode: multiply;
}

/* ════ GHOSTTY-WEB TERMINAL — fills the viewport ════ */
#ghostty-terminal {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 28px;
  z-index: 1;
  background: #000;
  overflow: hidden;
  padding: 8px 6px 4px 8px;
}
#ghostty-terminal canvas { display: block; }
#ghostty-terminal .xterm,
#ghostty-terminal .xterm-viewport,
#ghostty-terminal .xterm-screen { height: 100% !important; width: 100% !important; }
#ghostty-terminal .xterm-viewport { background: #000 !important; }

/* ════ NORTON COMMANDER F-KEY STATUS BAR ════ */
.dos-statusbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 10;
  height: 28px;
  padding: 5px 8px;
  box-sizing: border-box;
  background: var(--cyan-2);
  color: #000;
  font: 700 12px/1.6 var(--f-mono);
  display: flex;
  gap: 14px;
  align-items: center;
  letter-spacing: 0.5px;
  border-top: 1px solid #000;
  user-select: none;
}
.dos-statusbar .fk {
  display: inline-flex;
  gap: 4px;
  align-items: baseline;
}
.dos-statusbar .fk b {
  background: #000;
  color: var(--amber);
  padding: 1px 5px;
  font-weight: 700;
  font-family: var(--f-mono);
}
[data-theme="void"] .dos-statusbar {
  background: var(--amber-2);
  color: #000;
}
[data-theme="void"] .dos-statusbar .fk b {
  color: var(--amber);
}

/* small screens */
@media (max-width: 640px) {
  .dos-statusbar { gap: 8px; font-size: 11px; overflow-x: auto; white-space: nowrap; }
  #ghostty-terminal { bottom: 28px; padding: 4px 2px; }
}
</style>

function renderBIOS() {
  return new Promise((resolve) => {
    biosPhase = true;
    biosResolve = resolve;
    biosTypingDone = false;
    biosLineIndex = 0;
    term.write(CLEAR_SCREEN);
    typeBiosLine();
  });
}

function typeBiosLine() {
  if (!biosPhase) return;
  if (biosLineIndex >= BIOS_LINES.length) {
    biosTypingDone = true;
    return;
  }
  term.write(BIOS_LINES[biosLineIndex] + '\r\n');
  const plain = BIOS_LINES[biosLineIndex].replace(/\x1b\[[0-9;]*m/g, '');
  biosLineIndex++;
  const d = !plain.trim() ? 110 : (25 + Math.random() * 55);
  setTimeout(typeBiosLine, d);
}

function biosEnterPressed() {
  if (!biosTypingDone) {
    while (biosLineIndex < BIOS_LINES.length) {
      term.write(BIOS_LINES[biosLineIndex] + '\r\n');
      biosLineIndex++;
    }
    biosTypingDone = true;
  } else {
    biosPhase = false;
    const r = biosResolve;
    biosResolve = null;
    r && r();
  }
}

/* ══════════════════════════════════════════════════════════════
   SECTION RENDERERS
   ══════════════════════════════════════════════════════════════ */
function renderSectionHeader(idx, title, meta) {
  const cols = (term && term.cols) || 80;
  const w = Math.min(cols - 4, 84);
  const left = '══ ' + idx + ' ' + title.toUpperCase() + ' ';
  const metaChunk = meta ? (C.grey + meta + RESET + ' ' + C.bmagenta + '══') : '══';
  const metaLen = meta ? meta.length + 4 : 2;
  const fill = Math.max(2, w - left.length - metaLen);
  term.write('\r\n');
  term.write('  ' + C.bmagenta + BOLD + left + '═'.repeat(fill) + ' ' + metaChunk + RESET + '\r\n\r\n');
}

function renderPrincipleCard(rule) {
  const cols = (term && term.cols) || 80;
  const w = Math.min(cols - 4, 84);
  const inner = w - 4;
  const pad = '  ';
  const hLine = '═'.repeat(w - 2);
  const sLine = '─'.repeat(w - 2);
  const col = colorFor(rule.color);
  const numTxt = 'Rule ' + rule.num;
  const titleGap = Math.max(1, inner - rule.title.length - numTxt.length);
  const bodyLines = wrapText(rule.body, inner, '').split('\r\n').slice(0, 4);
  const quoteLines = wrapText('"' + rule.quote + '"', inner, '').split('\r\n').slice(0, 2);

  term.write(pad + col + '╔' + hLine + '╗' + RESET + '\r\n');
  term.write(pad + col + '║ ' + RESET + BOLD + col + rule.title + RESET + ' '.repeat(titleGap) + C.byellow + numTxt + RESET + col + ' ║' + RESET + '\r\n');
  term.write(pad + col + '╟' + sLine + '╢' + RESET + '\r\n');
  bodyLines.forEach(line => {
    term.write(pad + col + '║ ' + RESET + C.grey + line.padEnd(inner) + RESET + col + ' ║' + RESET + '\r\n');
  });
  quoteLines.forEach(line => {
    term.write(pad + col + '║ ' + RESET + BOLD + col + line.padEnd(inner) + RESET + col + ' ║' + RESET + '\r\n');
  });
  term.write(pad + col + '╚' + hLine + '╝' + RESET + '\r\n');
}

function renderStackItem(item) {
  const cols = (term && term.cols) || 80;
  const w = Math.min(cols - 4, 84);
  const inner = w - 4;
  const pad = '  ';
  const hLine = '═'.repeat(w - 2);
  const col = colorFor(item.color);
  const head = item.glyph + ' ' + item.name + '   ' + item.ver;
  const headGap = Math.max(1, inner - head.length - item.tag.length);
  const descLines = wrapText(item.desc, inner, '').split('\r\n').slice(0, 3);

  term.write(pad + col + '╔' + hLine + '╗' + RESET + '\r\n');
  term.write(pad + col + '║ ' + RESET + BOLD + col + head + RESET + ' '.repeat(headGap) + C.grey + item.tag + RESET + col + ' ║' + RESET + '\r\n');
  descLines.forEach(line => {
    term.write(pad + col + '║ ' + RESET + C.grey + line.padEnd(inner) + RESET + col + ' ║' + RESET + '\r\n');
  });
  term.write(pad + col + '╚' + hLine + '╝' + RESET + '\r\n');
}

function renderFlowCard(flow) {
  term.write('  ' + C.bcyan + flow.eyebrow + RESET + '\r\n');
  term.write('  ' + BOLD + C.bmagenta + flow.title.toUpperCase() + RESET + '\r\n');
  term.write('  ' + C.grey + flow.sub + RESET + '\r\n');
  flow.steps.forEach((s, i) => {
    const col = colorFor(s.color);
    const idx = String(i + 1).padStart(2, '0');
    const phase = s.phase.padEnd(12);
    const node = s.node.padEnd(28);
    term.write('    ' + C.byellow + idx + RESET + '  ' + BOLD + phase + RESET + '· ' + col + node + RESET + C.grey + '// ' + s.desc + RESET + '\r\n');
  });
  term.write('\r\n');
}

function renderQuoteCard(q) {
  const cols = (term && term.cols) || 80;
  const w = Math.min(cols - 4, 84);
  const inner = w - 4;
  const pad = '  ';
  const hLine = '═'.repeat(w - 2);
  const sLine = '─'.repeat(w - 2);
  const col = colorFor(q.color);
  const badgeTxt = '[ ' + q.badge + ' ]';
  const badgeGap = Math.max(1, inner - badgeTxt.length);
  const quoteLines = wrapText('"' + q.quote + '"', inner, '').split('\r\n').slice(0, 2);
  const narrLines = wrapText(q.narrator, inner, '').split('\r\n').slice(0, 3);

  term.write(pad + col + '╔' + hLine + '╗' + RESET + '\r\n');
  term.write(pad + col + '║ ' + RESET + BOLD + col + badgeTxt + RESET + ' '.repeat(badgeGap) + col + ' ║' + RESET + '\r\n');
  term.write(pad + col + '╟' + sLine + '╢' + RESET + '\r\n');
  quoteLines.forEach(line => {
    term.write(pad + col + '║ ' + RESET + BOLD + C.bwhite + line.padEnd(inner) + RESET + col + ' ║' + RESET + '\r\n');
  });
  term.write(pad + col + '╟' + sLine + '╢' + RESET + '\r\n');
  narrLines.forEach(line => {
    term.write(pad + col + '║ ' + RESET + C.grey + line.padEnd(inner) + RESET + col + ' ║' + RESET + '\r\n');
  });
  term.write(pad + col + '╚' + hLine + '╝' + RESET + '\r\n');
}

function renderPluginCard(p) {

  const skillCount = p.skills ? p.skills.length : 0;

function wrapText(text, width, indent) {
  indent = indent || '';
  const words = String(text || '').split(/\s+/);
  const lines = []; let line = '';
  for (const w of words) {
    if ((line + ' ' + w).trim().length > width) { if (line) lines.push(line); line = w; }
    else line = line ? line + ' ' + w : w;
  }
  if (line) lines.push(line);
  return lines.map(l => indent + l).join('\r\n');
}

/* ══════════════════════════════════════════════════════════════
   COMMAND DISPATCHER
   ══════════════════════════════════════════════════════════════ */
function dispatch(line) {
  const trimmed = line.trim();
  if (!trimmed) return false;
  history.push(trimmed);
  const parts = trimmed.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg = parts.slice(1).join(' ');
  switch (cmd) {
    case 'help': case '?': cmdHelp(); break;
    case 'plugins': case 'ls': case 'dir': cmdPlugins(); break;
    case 'cat': cmdCat(arg); break;
    case 'install': cmdInstall(arg); break;
    case 'search': case 'find': cmdSearch(arg); break;
    case 'principles': case 'rules': cmdPrinciples(); break;
    case 'stack': case 'tools': cmdStack(); break;
    case 'flows': case 'workflows': case 'pipelines': cmdFlows(); break;
    case 'manifest': case 'claude.md': case 'claudemd': cmdManifest(); break;
    case 'play': case 'replay': term.write('\r\n'); autoPlay(); return true;
    case 'theme': cmdTheme(arg.toLowerCase()); break;
    case 'clear': case 'cls': cmdClear(); break;
    case 'source': case 'repo': case 'github': cmdSource(); break;
    case 'whoami': case 'who': cmdWhoami(); break;
    case 'quit': case 'exit': cmdQuit(); break;
    default:
      term.write('\r\n' + C.bred + "Bad command or file name: " + parts[0] + RESET + '\r\n');
      term.write('  type ' + C.bcyan + 'help' + RESET + ' to see commands\r\n');
  }
  return false;
}

/* ══════════════════════════════════════════════════════════════
   INPUT HANDLER — supports printable chars, backspace, Enter,
   Ctrl+C, Ctrl+L, Up/Down history
   ══════════════════════════════════════════════════════════════ */
function handleInput(data) {
  if (biosPhase) {
    if (data === '\r' || data === '\n') biosEnterPressed();
    return;
  }
  if (autoPlayPhase) {
    if (data === '\r' || data === '\n' || data === '\x1b' || data === '\x03') {
      skipAutoPlay = true;
    }
    return;
  }
  if (!isRunning) return;
  // Handle CSI arrow sequences: ESC [ A/B/C/D
  if (data === '\x1b[A') { // up
    if (history.length === 0) return;
    if (historyIndex === -1) { savedBuffer = inputBuffer; historyIndex = history.length - 1; }
    else if (historyIndex > 0) { historyIndex--; }
    else return;
    redrawInput(history[historyIndex]);
    return;
  }
  if (data === '\x1b[B') { // down
    if (historyIndex === -1) return;
    if (historyIndex < history.length - 1) { historyIndex++; redrawInput(history[historyIndex]); }
    else { historyIndex = -1; redrawInput(savedBuffer); savedBuffer = ''; }
    return;
  }
  // Process each char (can be multi-char paste)
  for (const ch of data) {
    const code = ch.charCodeAt(0);
    if (ch === '\r' || ch === '\n') { // Enter
      const cmd = inputBuffer;
      const skipPrompt = dispatch(cmd);
      if (!skipPrompt) printPrompt();
      return;
    } else if (code === 0x7f || code === 0x08) { // Backspace or Ctrl+H
      if (inputBuffer.length > 0) {
        inputBuffer = inputBuffer.slice(0, -1);
        term.write('\b \b');
      }
    } else if (code === 0x03) { // Ctrl+C
      term.write(C.grey + '^C' + RESET);
      printPrompt();
      return;
    } else if (code === 0x0c) { // Ctrl+L
      term.write(CLEAR_SCREEN + PROMPT + inputBuffer);
    } else if (code >= 0x20 && code < 0x7f) { // printable ASCII
      inputBuffer += ch;
      term.write(ch);
    }
    // silently ignore other control chars
  }
}

function redrawInput(newLine) {
  // Erase current input visually, then redraw
  const eraseLen = inputBuffer.length;
  term.write('\b \b'.repeat(eraseLen));
  inputBuffer = newLine;
  term.write(newLine);
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
async function boot() {
  try {
    // Load plugins data in parallel with WASM init
    const [_, dataResp] = await Promise.all([
      init(),
      fetch('./data.json').then(r => r.ok ? r.json() : []).catch(() => []),
    ]);
    pluginsData = Array.isArray(dataResp) ? dataResp : [];

    term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'Monaco, Menlo, "Courier New", monospace',
      theme: currentTheme(),
      scrollback: 5000,
    });
    const fitAddon = new FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('ghostty-terminal'));
    fitAddon.fit();
    fitAddon.observeResize();
    window.addEventListener('resize', () => fitAddon.fit());

    term.onData(handleInput);
    term.focus();

    // BIOS POST phase — once per session unless ?reboot
    const forceReboot = /[?&]reboot(=|&|$)/.test(location.search);
    if (forceReboot) { try { sessionStorage.removeItem('dos-booted'); } catch (e) {} }
    let alreadyBooted = false;
    try { alreadyBooted = sessionStorage.getItem('dos-booted') === '1'; } catch (e) {}
    if (!alreadyBooted) {
      await renderBIOS();
      try { sessionStorage.setItem('dos-booted', '1'); } catch (e) {}
    }
    await autoPlay();
  } catch (err) {
    console.error('[tui] boot failed:', err);
    const el = document.getElementById('ghostty-terminal');
    if (el) el.innerHTML = '<pre style="color:#ff5555;padding:20px;font:14px monospace;">TUI boot failed. see console.\n\n' + String(err).replace(/[<>&]/g,'') + '</pre>';
  }
}

/* Theme sync with page-level attribute changes */
const themeObserver = new MutationObserver(() => {
  if (term) {
    try { term.options.theme = currentTheme(); }
    catch (e) { console.warn('[tui] theme sync failed:', e); }
  }
});
themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* F-key shortcuts + Shift+D theme toggle */
document.addEventListener('keydown', (e) => {
  if (!term || !isRunning) return;
  // Shift+D toggles theme — only when input buffer empty (avoid wiping mid-command)
  if ((e.key === 'D' || e.key === 'd') && e.shiftKey && !e.ctrlKey && !e.metaKey && inputBuffer.length === 0) {
    e.preventDefault();
    cmdTheme('');
    printPrompt();
    return;
  }
  // F-keys: map to commands
  const fKeyMap = {
    F1:  () => cmdHelp(),
    F3:  () => cmdPlugins(),
    F5:  () => autoPlay(),
    F8:  () => cmdTheme(''),
    F10: () => cmdQuit(),
  };
  if (fKeyMap[e.key]) {
    e.preventDefault();
    if (e.key === 'F5') { /* replay runs full autoplay, includes own prompt */ fKeyMap[e.key](); return; }
    fKeyMap[e.key]();
    if (isRunning) printPrompt();
  }
});

/* Persist theme from localStorage */
try {
  const saved = localStorage.getItem('nsct-theme');
  if (saved === 'void' || saved === 'signal') document.documentElement.setAttribute('data-theme', saved);
} catch (e) {}

/* Start boot sequence (WASM load → BIOS POST in terminal → welcome) */
boot();
</script>
</body>
</html>
