<style>
/* ════════════════════════════════════════════════════════════════
   MS-DOS TERMINAL MODE · CP437 · VGA 16-color · CRT scanlines
   signal = green-on-black (default DOS)
   void   = amber-on-black (monochrome CRT alt)
   ════════════════════════════════════════════════════════════════ */
:root, [data-theme="signal"] {
  --bg:           #000000;
  --ink:          #c0c0c0;
  --lime:         #55ff55;
  --grid-tint:    rgba(85,255,85,0.05);
  --scan-opacity: 0.12;
  --f-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Menlo', 'Monaco', 'Courier New', monospace;
}

[data-theme="void"] {
  --bg:           #0c0600;
  --ink:          #ffb86b;
  --lime:         #ffaa00;
  --grid-tint:    rgba(255,184,107,0.03);
  --scan-opacity: 0.22;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-mono);
  font-size: 14px;
  line-height: 1.4;
  height: 100vh;
  overflow: hidden;
}
::selection { background: var(--lime); color: #000; }

/* subtle grid tint */
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    repeating-linear-gradient(0deg,  transparent 0 19px, var(--grid-tint) 19px 20px),
    repeating-linear-gradient(90deg, transparent 0 19px, var(--grid-tint) 19px 20px);
  pointer-events: none;
  z-index: 0;
}

/* CRT scanlines — aggressive on top of terminal for the TUI feel */
body::after {
  content: "";
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,var(--scan-opacity)) 0,
    rgba(0,0,0,var(--scan-opacity)) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
  z-index: 5;
  mix-blend-mode: multiply;
}

/* ════ GHOSTTY-WEB TERMINAL — fills the viewport ════ */
#ghostty-terminal {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 1;
  background: #000;
  overflow: hidden;
  padding: 8px 6px 4px 8px;
}
#ghostty-terminal canvas { display: block; }

/* ════ SIGNAL: neon glow on terminal text + soft vignette ════ */
[data-theme="signal"] body {
  background:
    radial-gradient(ellipse 95% 75% at center, rgba(12, 36, 22, 0.55) 0%, transparent 70%),
    #000000;
}
[data-theme="signal"] #ghostty-terminal canvas {
  filter:
    drop-shadow(0 0 1px rgba(85, 255, 85, 0.55))
    drop-shadow(0 0 4px rgba(85, 255, 85, 0.22));
}
/* small screens */
@media (max-width: 640px) {
  #ghostty-terminal { padding: 4px 2px; }
}

/* ════ CUSTOM DOS BLOCK CURSOR — hides native mouse, follows movement ════ */
html, body, #ghostty-terminal, #ghostty-terminal * {
  cursor: none !important;
}
#dos-cursor {
  position: fixed;
  top: 0; left: 0;
  width: 10px;
  height: 18px;
  background: var(--lime);
  box-shadow: 0 0 6px var(--lime);
  pointer-events: none;
  z-index: 100;
  opacity: 0;
  transform: translate3d(-50px, -50px, 0);
  will-change: transform;
}
#dos-cursor.active {
  animation: dos-cursor-blink 1.06s steps(2, start) infinite;
}
@keyframes dos-cursor-blink {
  0%, 49%   { opacity: 1; }
  50%, 100% { opacity: 0; }
}
</style>
</head>

const CSI = '\x1b[';
// Scroll-preserving clear. ESC[2J erases visible cells in place without
// pushing them into scrollback (per VT spec, honored by ghostty-web's
// parser) — so first-boot BIOS POST vanishes when autoPlay clears and
// the user can't scroll up to read it. Instead: move cursor to last row,
// emit \n × rows to scroll the viewport into scrollback, then home.
// Falls back to 24 rows if term isn't ready yet.
function clearScreen() {
  const rows = (term && term.rows) || 24;
  return CSI + rows + ';1H' + '\n'.repeat(rows) + CSI + 'H';
}
const RESET = CSI + '0m', BOLD = CSI + '1m', UNDERLINE = CSI + '4m';
const FG = (n) => CSI + n + 'm';
const C = {
  cyan: FG(36), grey: FG(90),
  bred: FG(91), bgreen: FG(92), byellow: FG(93),
  bmagenta: FG(95), bcyan: FG(96), bwhite: FG(97),
};

let animatedOutput = false;
const LINE_DELAY = 18;

function pause(ms) { return new Promise(r => setTimeout(r, ms)); }

/* writes each line; pauses between them only when animatedOutput is on.
   Commands run with animatedOutput=false → loop stays fully sync (no microtask yield),
   so subsequent prompt printing sees the correct write order. */
async function writeLines(lines) {
  for (const l of lines) {
    term.write(l);
    if (animatedOutput && !skipAutoPlay) await pause(LINE_DELAY);
  }
}

function renderBIOS() {
  return new Promise((resolve) => {
    biosPhase = true;
    biosResolve = resolve;
    biosTypingDone = false;
    biosLineIndex = 0;
    // Terminal is fresh at boot — just home the cursor. Calling clearScreen()
    // here would pollute scrollback with `term.rows` empty lines users would
    // hit when scrolling up.
    term.write(CSI + 'H');
    typeBiosLine();
  });
}

function typeBiosLine() {
  if (!biosPhase) return;
  if (biosLineIndex >= BIOS_LINES.length) {
    biosTypingDone = true;
    return;
  }
  term.write(BIOS_LINES[biosLineIndex] + '\r\n');
  const plain = BIOS_LINES[biosLineIndex].replace(/\x1b\[[0-9;]*m/g, '');
  biosLineIndex++;
  const d = !plain.trim() ? 110 : (25 + Math.random() * 55);
  setTimeout(typeBiosLine, d);
}

function biosEnterPressed() {
  if (!biosTypingDone) {
    while (biosLineIndex < BIOS_LINES.length) {
      term.write(BIOS_LINES[biosLineIndex] + '\r\n');
      biosLineIndex++;
    }
    biosTypingDone = true;
  } else {
    biosPhase = false;
    const r = biosResolve;
    biosResolve = null;
    r && r();
  }
}

function printPrompt() {
  term.write('\r\n' + PROMPT);

/* ══════════════════════════════════════════════════════════════
   SECTION RENDERERS
   ══════════════════════════════════════════════════════════════ */
async function renderSectionHeader(idx, title, meta) {
  const cols = (term && term.cols) || 80;
  const w = Math.min(cols - 4, 84);
  const left = '══ ' + idx + ' ' + title.toUpperCase() + ' ';
  const metaChunk = meta ? (C.grey + meta + RESET + ' ' + C.bmagenta + '══') : '══';
  const metaLen = meta ? meta.length + 4 : 2;
  const fill = Math.max(2, w - left.length - metaLen);
  await writeLines([
    '\r\n',
    '  ' + C.bmagenta + BOLD + left + '═'.repeat(fill) + ' ' + metaChunk + RESET + '\r\n\r\n',
  ]);
}

async function renderPrincipleCard(rule) {
  const cols = (term && term.cols) || 80;
  const w = Math.min(cols - 4, 84);
  const inner = w - 4;
  const pad = '  ';
  const hLine = '═'.repeat(w - 2);
  const sLine = '─'.repeat(w - 2);
  const col = colorFor(rule.color);
  const numTxt = 'Rule ' + rule.num;
  const titleGap = Math.max(1, inner - rule.title.length - numTxt.length);
  const bodyLines = wrapText(rule.body, inner, '').split('\r\n').slice(0, 4);
  const quoteLines = wrapText('"' + rule.quote + '"', inner, '').split('\r\n').slice(0, 2);

  await writeLines([
    pad + col + '╔' + hLine + '╗' + RESET + '\r\n',
    pad + col + '║ ' + RESET + BOLD + col + rule.title + RESET + ' '.repeat(titleGap) + C.byellow + numTxt + RESET + col + ' ║' + RESET + '\r\n',
    pad + col + '╟' + sLine + '╢' + RESET + '\r\n',
    ...bodyLines.map(line => pad + col + '║ ' + RESET + C.grey + line.padEnd(inner) + RESET + col + ' ║' + RESET + '\r\n'),
    ...quoteLines.map(line => pad + col + '║ ' + RESET + BOLD + col + line.padEnd(inner) + RESET + col + ' ║' + RESET + '\r\n'),
    pad + col + '╚' + hLine + '╝' + RESET + '\r\n',
  ]);
}

async function renderStackItem(item) {
  const cols = (term && term.cols) || 80;
  const w = Math.min(cols - 4, 84);
  const inner = w - 4;
  const pad = '  ';
  const hLine = '═'.repeat(w - 2);
  const col = colorFor(item.color);
  const head = item.glyph + ' ' + item.name + '   ' + item.ver;
  const headGap = Math.max(1, inner - head.length - item.tag.length);
  const descLines = wrapText(item.desc, inner, '').split('\r\n').slice(0, 3);

  await writeLines([
    pad + col + '╔' + hLine + '╗' + RESET + '\r\n',
    pad + col + '║ ' + RESET + BOLD + col + head + RESET + ' '.repeat(headGap) + C.grey + item.tag + RESET + col + ' ║' + RESET + '\r\n',
    ...descLines.map(line => pad + col + '║ ' + RESET + C.grey + line.padEnd(inner) + RESET + col + ' ║' + RESET + '\r\n'),
    pad + col + '╚' + hLine + '╝' + RESET + '\r\n',
  ]);
}

async function renderFlowCard(flow) {
  await writeLines([
    '  ' + C.bcyan + flow.eyebrow + RESET + '\r\n',
    '  ' + BOLD + C.bmagenta + flow.title.toUpperCase() + RESET + '\r\n',
    '  ' + C.grey + flow.sub + RESET + '\r\n',
    ...flow.steps.map((s, i) => {
      const col = colorFor(s.color);
      const idx = String(i + 1).padStart(2, '0');
      const phase = s.phase.padEnd(12);
      const node = s.node.padEnd(28);
      return '    ' + C.byellow + idx + RESET + '  ' + BOLD + phase + RESET + '· ' + col + node + RESET + C.grey + '// ' + s.desc + RESET + '\r\n';
    }),
    '\r\n',
  ]);
}

  const col = colorFor(q.color);
  const badgeTxt = '[ ' + q.badge + ' ]';
  const badgeGap = Math.max(1, inner - badgeTxt.length);
  const quoteLines = wrapText('"' + q.quote + '"', inner, '').split('\r\n').slice(0, 2);
  const narrLines = wrapText(q.narrator, inner, '').split('\r\n').slice(0, 3);

  await writeLines([
    pad + col + '╔' + hLine + '╗' + RESET + '\r\n',
    pad + col + '║ ' + RESET + BOLD + col + badgeTxt + RESET + ' '.repeat(badgeGap) + col + ' ║' + RESET + '\r\n',
    pad + col + '╟' + sLine + '╢' + RESET + '\r\n',
    ...quoteLines.map(line => pad + col + '║ ' + RESET + BOLD + C.bwhite + line.padEnd(inner) + RESET + col + ' ║' + RESET + '\r\n'),
    pad + col + '╟' + sLine + '╢' + RESET + '\r\n',
    ...narrLines.map(line => pad + col + '║ ' + RESET + C.grey + line.padEnd(inner) + RESET + col + ' ║' + RESET + '\r\n'),
    pad + col + '╚' + hLine + '╝' + RESET + '\r\n',
  ]);
}

async function renderPluginCard(p) {
  const cols = (term && term.cols) || 80;
  const w = Math.min(cols - 4, 84);
  const inner = w - 4;
  const pad = '  ';
  const hLine = '═'.repeat(w - 2);
  const sLine = '─'.repeat(w - 2);

  const name = (p.name || '').slice(0, Math.max(1, inner - 12));
  const ver = 'v' + (p.version || '?');
  const titleGap = Math.max(1, inner - name.length - ver.length);

  const descLines = wrapText(p.desc, inner, '').split('\r\n').slice(0, 3);

  const skills = p.skills || [];
  const installTxt = 'install ' + p.name;
  const footerGap = Math.max(0, inner - installTxt.length);

  // Each skill = "▸ name" header + word-wrapped full desc lines (indented)
  const skillLines = skills.flatMap(sk => {
    const sn = (sk.name || '').slice(0, Math.max(1, inner - 4));
    const headerVis = 2 + sn.length;
    const headerPad = Math.max(0, inner - headerVis);
    const headerLine = pad + C.bmagenta + '║ ' + RESET +
      C.bgreen + '▸ ' + RESET +
      BOLD + C.bcyan + sn + RESET +
      ' '.repeat(headerPad) +
      C.bmagenta + ' ║' + RESET + '\r\n';

    const rawDesc = (sk.desc || '').replace(/\s+/g, ' ').trim();
    const wrapped = rawDesc
      ? wrapText(rawDesc, inner - 2, '').split('\r\n')
      : [];
    const descRows = wrapped.map(line => {
      const visible = '  ' + line;
      return pad + C.bmagenta + '║ ' + RESET +
        C.grey + visible.padEnd(inner) + RESET +
        C.bmagenta + ' ║' + RESET + '\r\n';
    });
    return [headerLine, ...descRows];
  });

  const lines = [
    pad + C.bmagenta + '╔' + hLine + '╗' + RESET + '\r\n',
    pad + C.bmagenta + '║ ' + RESET + BOLD + C.bmagenta + name + RESET + ' '.repeat(titleGap) + C.byellow + ver + RESET + C.bmagenta + ' ║' + RESET + '\r\n',
    pad + C.bmagenta + '╟' + sLine + '╢' + RESET + '\r\n',
    ...descLines.map(line => pad + C.bmagenta + '║ ' + RESET + C.grey + line.padEnd(inner) + RESET + C.bmagenta + ' ║' + RESET + '\r\n'),
  ];

  if (skillLines.length) {
    lines.push(pad + C.bmagenta + '╟' + sLine + '╢' + RESET + '\r\n');
    lines.push(...skillLines);
  }

  lines.push(pad + C.bmagenta + '║ ' + RESET + ' '.repeat(footerGap) + C.grey + installTxt + RESET + C.bmagenta + ' ║' + RESET + '\r\n');
  lines.push(pad + C.bmagenta + '╚' + hLine + '╝' + RESET + '\r\n');

  await writeLines(lines);
}

function wrapText(text, width, indent) {
  indent = indent || '';
  const words = String(text || '').split(/\s+/);
  const lines = []; let line = '';
  for (const w of words) {
    if ((line + ' ' + w).trim().length > width) { if (line) lines.push(line); line = w; }
    else line = line ? line + ' ' + w : w;
  }
  if (line) lines.push(line);
  return lines.map(l => indent + l).join('\r\n');
}

/* ══════════════════════════════════════════════════════════════
   COMMAND DISPATCHER
   ══════════════════════════════════════════════════════════════ */
function dispatch(line) {
  const trimmed = line.trim();
  if (!trimmed) return false;
  history.push(trimmed);
  const parts = trimmed.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg = parts.slice(1).join(' ');
  switch (cmd) {
    case 'help': case '?': cmdHelp(); break;
    case 'plugins': case 'ls': case 'dir': cmdPlugins(); break;
    case 'cat': cmdCat(arg); break;
    case 'install': cmdInstall(arg); break;
    case 'search': case 'find': cmdSearch(arg); break;
    case 'principles': case 'rules': cmdPrinciples(); break;
    case 'stack': case 'tools': cmdStack(); break;
    case 'flows': case 'workflows': case 'pipelines': cmdFlows(); break;
    case 'manifest': case 'claude.md': case 'claudemd': cmdManifest(); break;
    case 'play': case 'replay': term.write('\r\n'); autoPlay(); return true;
    case 'theme': cmdTheme(arg.toLowerCase()); break;
    case 'clear': case 'cls': cmdClear(); break;
    case 'source': case 'repo': case 'github': cmdSource(); break;
    case 'whoami': case 'who': cmdWhoami(); break;
    case 'quit': case 'exit': cmdQuit(); break;
    default:
      term.write('\r\n' + C.bred + "Bad command or file name: " + parts[0] + RESET + '\r\n');
      term.write('  type ' + C.bcyan + 'help' + RESET + ' to see commands\r\n');
  }
  return false;
}

/* ══════════════════════════════════════════════════════════════
   INPUT HANDLER — supports printable chars, backspace, Enter,
   Ctrl+C, Ctrl+L, Up/Down history
   ══════════════════════════════════════════════════════════════ */
function handleInput(data) {
  if (biosPhase) {
    if (data === '\r' || data === '\n') biosEnterPressed();
    return;
  }
  if (autoPlayPhase) {
    if (data === '\r' || data === '\n' || data === '\x1b' || data === '\x03') {
      skipAutoPlay = true;
    }
    return;
  }
  if (!isRunning) return;
  // Handle CSI arrow sequences: ESC [ A/B/C/D
  if (data === '\x1b[A') { // up
    if (history.length === 0) return;
    if (historyIndex === -1) { savedBuffer = inputBuffer; historyIndex = history.length - 1; }
    else if (historyIndex > 0) { historyIndex--; }
    else return;
    redrawInput(history[historyIndex]);
    return;
  }
  if (data === '\x1b[B') { // down
    if (historyIndex === -1) return;
    if (historyIndex < history.length - 1) { historyIndex++; redrawInput(history[historyIndex]); }
    else { historyIndex = -1; redrawInput(savedBuffer); savedBuffer = ''; }
    return;
  }
  // Process each char (can be multi-char paste)
  for (const ch of data) {
    const code = ch.charCodeAt(0);
    if (ch === '\r' || ch === '\n') { // Enter
      const cmd = inputBuffer;
      const skipPrompt = dispatch(cmd);
      if (!skipPrompt) printPrompt();
      return;
    } else if (code === 0x7f || code === 0x08) { // Backspace or Ctrl+H
      if (inputBuffer.length > 0) {
        inputBuffer = inputBuffer.slice(0, -1);
        term.write('\b \b');
      }
    } else if (code === 0x03) { // Ctrl+C
      term.write(C.grey + '^C' + RESET);
      printPrompt();
      return;
    } else if (code === 0x0c) { // Ctrl+L
      term.write(clearScreen() + PROMPT + inputBuffer);
    } else if (code >= 0x20 && code < 0x7f) { // printable ASCII
      inputBuffer += ch;
      term.write(ch);
    }
    // silently ignore other control chars
  }
}

function redrawInput(newLine) {
  // Erase current input visually, then redraw
  const eraseLen = inputBuffer.length;
  term.write('\b \b'.repeat(eraseLen));
  inputBuffer = newLine;
  term.write(newLine);
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
async function boot() {
  try {
    // Load plugins data in parallel with WASM init
    const [_, dataResp] = await Promise.all([
      init(),
      fetch('./data.json').then(r => r.ok ? r.json() : []).catch(() => []),
    ]);
    pluginsData = Array.isArray(dataResp) ? dataResp : [];

    term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'Monaco, Menlo, "Courier New", monospace',
      theme: currentTheme(),
      // ghostty-web's `scrollback` is forwarded to the WASM core's
      // `scrollbackLimit`, measured in BYTES. The WASM default (10000
      // bytes) is barely a screenful — autoPlay overflows scrollback
      // and BIOS POST + early plugins evict before the user can scroll
      // back to read them. Match Ghostty desktop's 10 MiB default.
      // ref: https://ghostty.org/docs/config/reference#scrollback-limit
      scrollback: 10 * 1024 * 1024,
    });
    const fitAddon = new FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('ghostty-terminal'));
    fitAddon.fit();
    fitAddon.observeResize();
    window.addEventListener('resize', () => fitAddon.fit());

    term.onData(handleInput);
    term.focus();

    // BIOS POST phase — once per session unless ?reboot
    const forceReboot = /[?&]reboot(=|&|$)/.test(location.search);
    if (forceReboot) { try { sessionStorage.removeItem('dos-booted'); } catch (e) {} }
    let alreadyBooted = false;
    try { alreadyBooted = sessionStorage.getItem('dos-booted') === '1'; } catch (e) {}
    if (!alreadyBooted) {
      await renderBIOS();
      try { sessionStorage.setItem('dos-booted', '1'); } catch (e) {}
    }
    await autoPlay();
  } catch (err) {
    console.error('[tui] boot failed:', err);
    const el = document.getElementById('ghostty-terminal');
    if (el) el.innerHTML = '<pre style="color:#ff5555;padding:20px;font:14px monospace;">TUI boot failed. see console.\n\n' + String(err).replace(/[<>&]/g,'') + '</pre>';
  }
}

/* Theme sync with page-level attribute changes */
const themeObserver = new MutationObserver(() => {
  if (term) {
    try { term.options.theme = currentTheme(); }
    catch (e) { console.warn('[tui] theme sync failed:', e); }
  }
});
themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* F-key shortcuts + Shift+D theme toggle */
document.addEventListener('keydown', (e) => {
  if (!term || !isRunning) return;
  // Shift+D toggles theme — only when input buffer empty (avoid wiping mid-command)
  if ((e.key === 'D' || e.key === 'd') && e.shiftKey && !e.ctrlKey && !e.metaKey && inputBuffer.length === 0) {
    e.preventDefault();
    cmdTheme('');
    printPrompt();
    return;
  }
  // F-keys: map to commands
  const fKeyMap = {
    F1:  () => cmdHelp(),
    F3:  () => cmdPlugins(),
    F5:  () => autoPlay(),
    F8:  () => cmdTheme(''),
    F10: () => cmdQuit(),
  };
  if (fKeyMap[e.key]) {
    e.preventDefault();
    if (e.key === 'F5') { /* replay runs full autoplay, includes own prompt */ fKeyMap[e.key](); return; }
    fKeyMap[e.key]();
    if (isRunning) printPrompt();
  }
});

/* Persist theme from localStorage */
try {
  const saved = localStorage.getItem('nsct-theme');
  if (saved === 'void' || saved === 'signal') document.documentElement.setAttribute('data-theme', saved);
} catch (e) {}

/* ══════════════════════════════════════════════════════════════
   CUSTOM DOS BLOCK CURSOR — snaps to character grid, blinks once moved
   cursor snaps to terminal cell (floor of mouse / cellSize) so it
   jumps line-by-line like an MS-DOS text-mode pointer, never free-floats
   ══════════════════════════════════════════════════════════════ */
const dosCursor = document.getElementById('dos-cursor');
let dosCursorStarted = false;
// fallback derived from Terminal config (fontSize: 14) — overridden by measureCell when term DOM ready
let cellW = 14 * 0.6, cellH = 14 * 1.2;
let cellOriginX = 0, cellOriginY = 0;

function measureCell() {
  if (!term || !term.cols || !term.rows) return;
  const container = document.getElementById('ghostty-terminal');
  if (!container) return;
  // ghostty-web renders into a <canvas>; measure that for cell size.
  // Fall back to the container if the canvas hasn't mounted yet.
  const el = container.querySelector('canvas') || container;
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return;
  cellW = r.width / term.cols;
  cellH = r.height / term.rows;
  cellOriginX = r.left;
  cellOriginY = r.top;
  dosCursor.style.width  = cellW + 'px';
  dosCursor.style.height = cellH + 'px';
}

let measured = false;
window.addEventListener('resize', () => { measured = false; }, { passive: true });

document.addEventListener('mousemove', (e) => {
  if (!measured) { measureCell(); measured = true; }
  if (!dosCursorStarted) { dosCursor.classList.add('active'); dosCursorStarted = true; }
  const gx = Math.floor((e.clientX - cellOriginX) / cellW);
  const gy = Math.floor((e.clientY - cellOriginY) / cellH);
  const x = cellOriginX + gx * cellW;
  const y = cellOriginY + gy * cellH;
  dosCursor.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
}, { passive: true });

/* Start boot sequence (WASM load → BIOS POST in terminal → welcome) */
boot();
</script>
</body>
